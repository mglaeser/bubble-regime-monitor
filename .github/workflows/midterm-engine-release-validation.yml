name: midterm-engine-release-validation

# The approved engine release, validated where no provider call is possible.
#
# ## Why this is a separate workflow
#
# `midterm-panel-dry-run` deliberately holds NO token of any kind: it proves the
# lane works from a clean clone with nothing but the repository contents, and
# handing it a credential — even `GITHUB_TOKEN` — would weaken the one thing it
# demonstrates. This validation must read a release ASSET, which needs a token
# on a private repository. Two different scopes, so two different jobs.
#
# ## What it may hold, and what it may not
#
#   contents: read       enough to read a release and its assets
#   github.token         passed to exactly one step, the validation itself
#   the provider key     NEVER. There is no `secrets.` expression anywhere in
#                        this file, so the credential is not merely unused —
#                        there is no expression that could deliver it.
#
# `${{ github.token }}` rather than `${{ secrets.GITHUB_TOKEN }}`: the same
# value, and it keeps `secrets.` out of the file entirely, so "this workflow
# contains no secrets reference" stays a property a test can check by reading
# the bytes rather than by understanding which secret name is benign.
#
# ## Why it runs even though the provider key is installed
#
# Because the key is installed. While the lane sits at
# MIDTERM_SINGLE_REPO_PANEL_STAGED_PROVIDER_KEY_PRESENT_NO_CALLS, any provider
# call is unexpected by definition, so the check that the release is readable,
# correctly digested and honestly labelled has to happen in a job that could not
# make one — and it has to happen BEFORE the first real panel, not as part of
# it. A validation that first ran inside the credential-bearing job would report
# a broken release by spending money to find out.

# No `workflow_dispatch`, deliberately, and NOT because a dispatch would be
# dangerous here in its committed form. A dispatched workflow runs a
# BRANCH-SELECTED copy, so a branch version of this file could be edited to
# reference the repository provider secret — the same selected-ref hazard that
# removed the dispatch trigger from the privileged panel and deleted the rerun
# convenience. `midterm-panel-dry-run` carries a narrow exemption because it
# holds no token at all; this job holds `github.token`, so it does not qualify
# for that exemption and does not ask for one. It runs on every pull request and
# every push, which is when the answer is wanted.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: midterm-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: midterm-engine-release-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Prove no provider credential is in scope
        # Before anything opens a socket. A job that discovered a credential
        # halfway through would already have run half of a live lane, and this
        # one exists precisely to be the half that cannot.
        run: |
          python - <<'PROBE'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from midtermpanel import releasevalidation
          print(json.dumps(
              releasevalidation.assert_no_provider_credential_is_in_scope(
                  dict(os.environ)), indent=2, sort_keys=True))
          PROBE

      - name: Validate the exact approved release with no route to the provider
        # The real materialiser against the real release. Not a stub and not a
        # fixture: it resolves the tagged release, refuses a draft or a release
        # belonging to another repository, downloads exactly one
        # `engine-identity.json`, hashes it to the approved digest, strict-loads
        # it, re-seals its provenance and compares every restated field in
        # governance against the document that actually arrived.
        #
        # All of it inside an egress guard that permits only the release-asset
        # hosts and is PROVED by an attempted connection to the provider host
        # that must be refused.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m midtermpanel.releasevalidation

      - name: Assert the declared state is reachable and reached
        # The state ladder, re-walked from the document's own recorded history
        # through the same `assert_transition` a live transition uses. A state
        # that was written rather than reached fails here.
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python - <<'PROBE'
          import json
          from midtermpanel import policystate
          print(json.dumps(policystate.assert_recorded_history_is_a_legal_walk(
              root="."), indent=2, sort_keys=True))
          print(json.dumps(policystate.assert_state_is_consistent_with_reality(
              root="."), indent=2, sort_keys=True))
          print(json.dumps(policystate.assert_trusted_lane_is_locked(root="."),
                           indent=2, sort_keys=True))
          PROBE

      - name: Run the release-validation and state-ladder suites
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests/test_midterm_release_activation.py -q \
            -p no:randomly
