# The mid-term single-repository review panel. HOLDS A PROVIDER SECRET.
#
# This is the only workflow in the repository that both holds a provider
# credential and runs automatically in response to a pull request. Everything
# about its shape is load-bearing, and `scripts/midtermpanel/privilegedworkflow.py`
# asserts every one of the properties below over this file in ordinary CI. Read
# that module before editing this one; a change here that it does not permit will
# fail the suite rather than ship.
#
# ## Why `workflow_run` and not `pull_request`
#
# `livepolicy.py` refuses any secret in a `pull_request`-triggered workflow,
# because such a workflow runs code the pull request author wrote. Its refusal
# message names this exact remedy: "Move it to a workflow_run job that checks out
# trusted code and takes the candidate as data." That is what this file is.
#
# A `workflow_run` workflow is taken from the DEFAULT BRANCH, not from the pull
# request. The pull request cannot edit the file that reviews it. That is the
# entire safety argument, and it survives only while the two rules below hold.
#
# ## The two rules
#
#   1. The candidate's tree is never materialised. Candidate commits arrive as
#      inert git OBJECTS the trusted `fetch-depth: 0` checkout already brought
#      in — this lane never fetches after checkout, because the token is not
#      persisted and the repository is private; nothing checks them out,
#      unpacks them, installs them or imports them. No `ref:` on any checkout, no
#      `download-artifact`, no `cache`, no `git checkout` in any `run:`.
#
#   2. The secret is scoped to the two jobs that spend it. `preflight` decides
#      whether the run may proceed and `finalize` runs on every failure path;
#      neither has a credential in scope while doing so.
#
# ## The accepted residual, stated where it applies
#
# The key is a PERSISTENT REPOSITORY-level Actions secret, because GitHub Free
# private repositories have no environment-scoped secret boundary. A pull request
# that adds or edits a `pull_request` workflow may be able to reference it. This
# workflow cannot prevent that — no workflow can. The operator accepts the
# residual; the panel flags every workflow-changing PR as HIGH_RISK_WORKFLOW_CHANGE
# so the human merge gate can require a source review of the diff.
#
# Nothing here is write-separated. Nothing here may publish a `trusted-*` status
# or emit a `TRUSTED_*` evidence class.
#
# Action pins (immutable SHAs; mapping in scripts/trustedlane/actionpolicy.py):
#   actions/checkout        11d5960a326750d5838078e36cf38b85af677262  (v4.4.0)
#   actions/setup-python    a26af69be951a213d495a4c3e4e4022e16d87065  (v5.6.0)
#   actions/upload-artifact ea165f8d65b6e75b540449e92b4886f43607fa02  (v4.6.2)

name: midterm-panel-review

on:
  # EXACTLY ONE TRIGGER, and the reason is the checkout.
  #
  # Fires when ordinary CI completes. Filtered to `ci` by name: an unfiltered
  # workflow_run fires on the completion of EVERY workflow including one a pull
  # request just added, which would let the candidate choose when the privileged
  # run starts and what event payload it reads.
  #
  # `workflow_dispatch` USED TO BE HERE and was removed by external review. The
  # argument for keeping it was that its inputs "select nothing and reach no
  # code" — which is true of the inputs and beside the point. A manually
  # dispatched workflow runs against a SELECTED REF, and every checkout in this
  # file deliberately omits `ref:`. Under `workflow_run` that omission is the
  # safety property: the definition and the checkout both come from the default
  # branch. Under `workflow_dispatch` it becomes the hazard: the checkout takes
  # the dispatched ref, so a dispatch against a branch carrying modified
  # `scripts/midtermpanel` executes that branch's code in `count` and `panel`
  # with the provider key in scope.
  #
  # The runtime approval phrase authenticated the CANDIDATE being reviewed. It
  # never authenticated the ref supplying the reviewer.
  #
  # Controlled reruns use GitHub's "Re-run all jobs" on the ordinary CI run,
  # or `gh run rerun <CI_RUN_ID> --repo mglaeser/bubble-regime-monitor`. A
  # convenience workflow that did this was removed: a workflow_dispatch
  # workflow runs a branch-selected copy, so with a persistent repository
  # secret a branch version could reference it.
  workflow_run:
    workflows: ["ci"]
    types: [completed]


# `statuses: write` is the only write scope, and it exists solely to publish
# `midterm-panel-count` / `midterm-panel-review` onto the exact candidate head.
# An unset block would inherit the repository default, which may be write-all.
permissions:
  contents: read
  actions: read
  # `checks: read` is what `GET /commits/{sha}/check-runs` needs. An explicit
  # permissions block sets every UNLISTED scope to `none`, so leaving it out
  # did not inherit a default — it revoked the scope, and the first real
  # privileged run refused with `where=check-runs http_status=403` before it
  # could verify ordinary CI. A read scope on a surface this lane already
  # depends on.
  checks: read
  pull-requests: read
  statuses: write

defaults:
  run:
    shell: bash

# `pyproject` installs only `app*`, so `midtermpanel` is not an installed
# package and `python -m midtermpanel...` from the repository root does not
# resolve. The import root is stated explicitly here rather than by installing
# the whole repository, so which module gets imported cannot change silently
# when packaging does. `tests/test_midterm_panel.py` proves both directions:
# the command works with this variable and fails without it.
env:
  PYTHONPATH: ${{ github.workspace }}/scripts

# One panel per candidate head. A rerun of CI on the same head must not buy a
# second panel; `midtermpanel.dedupe` additionally binds reuse to the engine,
# policy and request-semantics digests, because "same SHA" is not the same claim
# as "same review".
concurrency:
  # `workflow_run` is the only trigger, so its head is the only
  # identity. The `|| inputs.candidate_head_sha` fallback was left
  # over from the removed dispatch trigger and could never resolve.
  group: midterm-panel-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- preflight
  # NO SECRET IN SCOPE. This job decides whether the run may proceed, and a
  # decision made in a process holding a credential is a decision whose failure
  # modes include leaking it.
  preflight:
    name: midterm-preflight
    runs-on: ubuntu-latest
    # A CEILING, not an estimate. GitHub's default is 360 minutes, and two of
    # these jobs hold a provider key — a hung job with a credential in scope is
    # a credential in scope for six hours. `observation.settle` also added up to
    # sixty seconds of deliberate waiting here, which is a reason to state the
    # bound rather than to leave it at the default.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      statuses: write
    # Every output `preflight` emits is declared here, including the ones only
    # the count and panel jobs read. An undeclared output does not error — it
    # resolves to the EMPTY STRING, so `engine_digest` and `policy_digest` were
    # silently arriving blank in both credential-bearing jobs.
    # `tests/test_midterm_panel.py::TestWorkflowOutputsHaveProducers` walks the
    # workflow's own expressions and reddens if a consumed output loses its
    # declaration again.
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      # Why the run did or did not review anything. A push to the
      # default branch is NOT_APPLICABLE_NO_PULL_REQUEST — a normal
      # answer, published rather than silently skipped.
      applicability: ${{ steps.decide.outputs.applicability }}
      applicability_reason: ${{ steps.decide.outputs.applicability_reason }}
      provider_attempts: ${{ steps.decide.outputs.provider_attempts }}
      generation_attempts: ${{ steps.decide.outputs.generation_attempts }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
      high_risk: ${{ steps.decide.outputs.high_risk }}
      workflow_change: ${{ steps.decide.outputs.workflow_change }}
      engine_digest: ${{ steps.decide.outputs.engine_digest }}
      policy_digest: ${{ steps.decide.outputs.policy_digest }}
      review_class: ${{ steps.decide.outputs.review_class }}
      triggering_ci_run_id: ${{ steps.decide.outputs.triggering_ci_run_id }}
      triggering_ci_run_attempt: ${{ steps.decide.outputs.triggering_ci_run_attempt }}
      tested_base_sha: ${{ steps.decide.outputs.tested_base_sha }}
      tested_head_sha: ${{ steps.decide.outputs.tested_head_sha }}
    steps:
      # No `ref:`. For a workflow_run event the default checkout is the
      # default-branch commit this workflow definition came from, which is
      # exactly what a privileged job wants. Naming a ref could only move it
      # toward candidate-controlled code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the hash-locked runtime
        run: |
          python -m pip install --require-hashes --no-deps \
            -r requirements-trusted-runtime.txt

      - name: Re-verify this workflow against its own static policy
        # The validator runs in ordinary CI too. Running it again HERE, from the
        # default-branch checkout, is the difference between "the file was
        # correct when someone last ran the suite" and "the file that is
        # executing right now is correct".
        run: |
          python - <<'PROBE'
          import json, sys
          sys.path.insert(0, "scripts")
          from midtermpanel import privilegedworkflow
          print(json.dumps(privilegedworkflow.validate(root="."), indent=2)[:2000])
          PROBE

      - name: Materialise the approved engine release
        # §4. Preflight publishes `engine_digest`, and it must be the APPROVED
        # engine's digest. It used to be derived from `MIDTERM_ENGINE_*`, which
        # the workflow set to the candidate head — so the identity changed with
        # every push to the pull request and the dedupe binding tracked the
        # candidate rather than the reviewer.
        run: |
          python - >> "$GITHUB_ENV" <<'PROBE'
          import json
          doc = json.load(open("governance/midterm-panel-engine-release.json"))
          for key, variable in (
                  ("approved_engine_source_sha",
                   "MIDTERM_APPROVED_ENGINE_SOURCE_SHA"),
                  ("approved_engine_protected_sha",
                   "MIDTERM_APPROVED_ENGINE_PROTECTED_SHA"),
                  ("approved_engine_artifact_sha256",
                   "MIDTERM_APPROVED_ENGINE_ARTIFACT_SHA256"),
                  ("approved_engine_release_tag",
                   "MIDTERM_APPROVED_ENGINE_RELEASE_TAG"),
                  ("approved_engine_identity_sha256",
                   "MIDTERM_APPROVED_ENGINE_IDENTITY_SHA256")):
              if doc.get(key):
                  print(f"{variable}={doc[key]}")
          # Exported through a SEPARATE loop, because the loop above skips
          # falsy values and `native_branch_protection` is legitimately
          # `false` on this repository. Under the old guard the honest answer
          # would have been the one value that never reached the consumer,
          # which is the same shape of bug as the truthiness check in
          # `enginebuild.PROVENANCE_FIELDS`.
          for key, variable in (
                  ("native_branch_protection",
                   "MIDTERM_APPROVED_ENGINE_NATIVE_BRANCH_PROTECTION"),
                  ("control_class",
                   "MIDTERM_APPROVED_ENGINE_CONTROL_CLASS")):
              if key in doc:
                  value = doc[key]
                  if isinstance(value, bool):
                      value = "true" if value else "false"
                  print(f"{variable}={value}")
          PROBE

      - name: Identify the exact candidate and verify ordinary CI
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          OBSERVED_REF: ${{ github.ref }}
          TRIGGER_EVENT: ${{ github.event_name }}
          RUN_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # No DISPATCH_* variables. They were inputs of the removed
          # workflow_dispatch trigger and could never resolve; `preflightcli`
          # refuses a dispatch event outright.
        run: |
          python -m midtermpanel.preflightcli

  # -------------------------------------------------------------------- count
  # FIRST job permitted to reference the provider secret.
  count:
    name: midterm-count
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Carried out of the job because RUNNER_TEMP is per-job: the journal this
    # job writes is not on finalize's runner at all. Without these, a refusal
    # between the first provider call and the evidence write leaves finalize
    # with nothing to report but a zero it cannot justify.
    outputs:
      provider_attempts: ${{ steps.attempts.outputs.provider_attempts }}
      generation_attempts: ${{ steps.attempts.outputs.generation_attempts }}
      journal_present: ${{ steps.attempts.outputs.journal_present }}
      accounting_complete: ${{ steps.attempts.outputs.accounting_complete }}
      accounting_state: ${{ steps.attempts.outputs.accounting_state }}
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the hash-locked runtime
        run: |
          python -m pip install --require-hashes --no-deps \
            -r requirements-trusted-runtime.txt

      - name: Materialise the approved engine release
        id: release
        # The engine's identity, from a committed governance document. NOT from
        # the head under review: the reviewer must not be the reviewed, and
        # `engine.resolve_release_config` refuses the retired
        # `MIDTERM_ENGINE_CANDIDATE_SHA` outright rather than ignoring it, so a
        # workflow that still exported it would fail here rather than quietly
        # reviewing a pull request with its own edited code.
        run: |
          python - >> "$GITHUB_ENV" <<'PROBE'
          import json
          doc = json.load(open("governance/midterm-panel-engine-release.json"))
          for key, variable in (
                  ("approved_engine_source_sha",
                   "MIDTERM_APPROVED_ENGINE_SOURCE_SHA"),
                  ("approved_engine_protected_sha",
                   "MIDTERM_APPROVED_ENGINE_PROTECTED_SHA"),
                  ("approved_engine_artifact_sha256",
                   "MIDTERM_APPROVED_ENGINE_ARTIFACT_SHA256"),
                  ("approved_engine_release_tag",
                   "MIDTERM_APPROVED_ENGINE_RELEASE_TAG"),
                  ("approved_engine_identity_sha256",
                   "MIDTERM_APPROVED_ENGINE_IDENTITY_SHA256")):
              if doc.get(key):
                  print(f"{variable}={doc[key]}")
          # Exported through a SEPARATE loop, because the loop above skips
          # falsy values and `native_branch_protection` is legitimately
          # `false` on this repository. Under the old guard the honest answer
          # would have been the one value that never reached the consumer,
          # which is the same shape of bug as the truthiness check in
          # `enginebuild.PROVENANCE_FIELDS`.
          for key, variable in (
                  ("native_branch_protection",
                   "MIDTERM_APPROVED_ENGINE_NATIVE_BRANCH_PROTECTION"),
                  ("control_class",
                   "MIDTERM_APPROVED_ENGINE_CONTROL_CLASS")):
              if key in doc:
                  value = doc[key]
                  if isinstance(value, bool):
                      value = "true" if value else "false"
                  print(f"{variable}={value}")
          PROBE

      - name: Assert the candidate is present as OBJECTS
        # NO FETCH. `actions/checkout` runs with `persist-credentials: false`,
        # which deliberately removes its token from every later git command —
        # and this repository is PRIVATE, so a later `git fetch` that has to
        # reach origin cannot authenticate.
        #
        # It does not need to. `fetch-depth: 0` makes the trusted checkout
        # fetch every branch's history while it still holds its own token, and
        # a same-repository pull request's head IS a branch in origin. Preflight
        # refuses a fork before this point precisely because that assumption is
        # what makes the objects present.
        #
        # The fetch this step replaced was measured, not guessed (git 2.43.0):
        # `git fetch --no-tags origin <sha>` exits 0 WITHOUT contacting the
        # remote when the object is already present, and exits 128 when it is
        # not. So it was a silent no-op whenever it was unnecessary, and a
        # mid-job failure — after the provider key had been read — in exactly
        # the cases it existed for.
        #
        # So this ASSERTS rather than acquires. A missing object is a named
        # failure here, before the provider key is read.
        #
        # `git cat-file -e` reads the object database and touches no worktree —
        # the object/worktree distinction that is this lane's whole safety
        # argument.
        env:
          CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          CANDIDATE_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          set -euo pipefail
          for sha in "$CANDIDATE_HEAD_SHA" "$CANDIDATE_BASE_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::candidate commit ${sha} is absent from the" \
                   "full-history checkout. This lane never fetches after" \
                   "checkout: the token is not persisted and the repository" \
                   "is private. A same-repository head should always be here." >&2
              exit 1
            fi
          done
          echo "MIDTERM_REPOSITORY_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Materialise the trusted runtime
        # WHY this exists, and why it is not a `cd`.
        #
        # `$GITHUB_WORKSPACE` is the CANDIDATE ROOT. The candidate's commits
        # are present in it as objects, and `engine.assert_no_candidate_path_is_importable`
        # refuses the run when any directory inside it is on `sys.path`,
        # because a candidate directory on the import path makes candidate
        # bytes importable — the one thing this lane's whole argument rests on
        # not being true.
        #
        # The committed invocation put it there TWICE: `PYTHONPATH` named
        # `<workspace>/scripts`, and `python -m` prepends the working
        # directory, which defaults to `<workspace>`. Panel run 31534191556 —
        # the first run ever authorised to spend — refused on exactly those
        # two entries, inside the job that already held the provider key.
        #
        # So the engine is materialised OUT of the repository before it is
        # imported. `git archive` reads the trusted commit's BLOBS rather than
        # the worktree, so what runs is what that commit holds even if a file
        # on disk differs. Only what the engine imports is materialised:
        # `midtermpanel` reaches into `trustedlane` for `enginebridge`,
        # `enginebuild` and `actionpolicy`, and a runtime holding only the
        # first imports and then fails.
        #
        # The THIRD path is a single top-level module, and it is not optional.
        # `panel._upstream()` does `import independent_verify` — the panel
        # deliberately reuses the default branch's policy implementation rather
        # than re-deriving `norm_reason`, `model_matches` and the approval rules
        # a second time. A runtime holding the two packages and not that file
        # imports, counts, sends every request, normalises every reply, and THEN
        # dies in `anti_copy_tripwire` with `ModuleNotFoundError: No module
        # named 'independent_verify'` — after the money is spent and before any
        # panel evidence is written. It is a FILE and not a package:
        # `scripts/independent_verify.py` under `--strip-components=1` extracts
        # to `<runtime>/independent_verify.py`, which is exactly where a
        # top-level import looks for it.
        #
        # The workspace keeps its one job: the git repository the review data
        # is read from. It simply stops being anywhere the interpreter looks
        # for code.
        env:
          CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          trusted="$(git rev-parse HEAD)"
          # The reviewer must not be the reviewed. This lane never checks the
          # candidate out, so this should be unreachable — which is why it is
          # asserted rather than assumed.
          if [ "$trusted" = "$CANDIDATE_HEAD_SHA" ]; then
            echo "::error::the trusted checkout is the candidate head" \
                 "${CANDIDATE_HEAD_SHA}; refusing to build the engine out of" \
                 "the code under review" >&2
            exit 1
          fi
          runtime="$RUNNER_TEMP/midterm/runtime"
          rm -rf "$runtime"
          mkdir -p "$runtime"
          git archive --format=tar "$trusted" \
            scripts/midtermpanel \
            scripts/trustedlane \
            scripts/independent_verify.py \
            | tar -x -C "$runtime" --strip-components=1
          for package in midtermpanel trustedlane; do
            if [ ! -f "$runtime/$package/__init__.py" ]; then
              echo "::error::${package} is missing from the materialised" \
                   "runtime; the engine imports both" >&2
              exit 1
            fi
          done
          # Asserted separately from the loop above because it is a MODULE and
          # not a package, and because the thing it protects happens late: the
          # import that needs it runs after every provider call has been paid
          # for. A missing file must fail here, before the key is read, and not
          # in `anti_copy_tripwire`.
          if [ ! -f "$runtime/independent_verify.py" ]; then
            echo "::error::independent_verify.py is missing from the" \
                 "materialised runtime; panel._upstream() imports it as a" \
                 "top-level module once every model has answered" >&2
            exit 1
          fi
          # An EMPTY directory to run from. `-P` keeps the working directory
          # off `sys.path` anyway; running somewhere with nothing in it means
          # the guarantee does not rest on that flag alone.
          mkdir -p "$RUNNER_TEMP/midterm/run"
          echo "MIDTERM_TRUSTED_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "MIDTERM_TRUSTED_RUNTIME_COMMIT=$trusted" >> "$GITHUB_ENV"

      - name: Materialise the operator PIN record
        run: |
          mkdir -p "$RUNNER_TEMP/midterm/inputs"
          cp governance/midterm-panel-pins.json \
            "$RUNNER_TEMP/midterm/inputs/pins.json"
          echo "MIDTERM_PIN_RECORD_PATH=$RUNNER_TEMP/midterm/inputs/pins.json" \
            >> "$GITHUB_ENV"

      - name: Materialise the run challenge
        # Written to a file rather than exported as a value, so it does not sit
        # in the environment of every later step. A challenge a later step could
        # print is a challenge that can be replayed.
        run: |
          mkdir -p "$RUNNER_TEMP/midterm/inputs"
          python -c "import secrets;print(secrets.token_hex(32))" \
            > "$RUNNER_TEMP/midterm/inputs/challenge.txt"
          echo "MIDTERM_CHALLENGE_PATH=$RUNNER_TEMP/midterm/inputs/challenge.txt" \
            >> "$GITHUB_ENV"

      # Materialise the operator-approved identity document BEFORE the step
      # that receives the provider key. GITHUB_TOKEN only: a download that
      # could also reach the provider is a download whose compromise costs
      # money. The module re-checks that ordering at runtime and refuses if a
      # provider secret is already in scope.
      #
      # The `if:` guard remains, and it is now the DRY-RUN path rather than
      # the current state: a release tag IS configured on main, so this step
      # runs. When no tag is configured — a dry run against unbound
      # governance — the step is skipped and provider mode refuses for the
      # missing identity path rather than proceeding, which is the honest
      # failure and not a silent downgrade.
      - name: Materialise the approved engine identity document
        if: env.MIDTERM_APPROVED_ENGINE_RELEASE_TAG != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
        run: python -m midtermpanel.releaseasset

      - name: Count every governed model and batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIDTERM_PANEL_PROVIDER_KEY: ${{ secrets.TRUSTED_VERIFIER_OPENAI_KEY }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          CANDIDATE_PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          CANDIDATE_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          MIDTERM_ENGINE_DIGEST: ${{ needs.preflight.outputs.engine_digest }}
          MIDTERM_POLICY_DIGEST: ${{ needs.preflight.outputs.policy_digest }}
          # The review CLASS preflight derived from the pull-request number,
          # against a closed rule in trusted code. The two transport ceilings
          # that used to sit here as literals now live in the selected profile:
          # `MIDTERM_GENERATION_ATTEMPT_CAP: '60'` silently contradicted the
          # operator-approved cap of 80, so a plan priced for 80 attempts would
          # have stopped at 60 under a limit nobody wrote.
          MIDTERM_REVIEW_CLASS: ${{ needs.preflight.outputs.review_class }}
          # Bound into the evidence so the merge gate can prove the panel
          # reviewed what ordinary CI actually tested.
          MIDTERM_TRIGGERING_CI_RUN_ID: ${{ needs.preflight.outputs.triggering_ci_run_id }}
          MIDTERM_TRIGGERING_CI_RUN_ATTEMPT: ${{ needs.preflight.outputs.triggering_ci_run_attempt }}
          MIDTERM_TESTED_BASE_SHA: ${{ needs.preflight.outputs.tested_base_sha }}
          MIDTERM_TESTED_HEAD_SHA: ${{ needs.preflight.outputs.tested_head_sha }}
          # Overrides the workflow-level PYTHONPATH, which names
          # `<workspace>/scripts` — a directory INSIDE the candidate
          # root. `Materialise the trusted runtime` put the same two
          # packages here, from the trusted commit's blobs.
          PYTHONPATH: ${{ runner.temp }}/midterm/runtime
        # NOT $GITHUB_WORKSPACE, which is where Actions would run this
        # by default: `-m` prepends the working directory to `sys.path`
        # and the workspace is the candidate root.
        working-directory: ${{ runner.temp }}/midterm/run
        run: |
          # `-P` does not prepend the working directory to `sys.path`;
          # `-s` leaves user site-packages out. NOT `-I`, which is the
          # obvious way to say "isolated" and is unusable here: it
          # implies `-E`, which would discard the PYTHONPATH above and
          # leave the trusted runtime unimportable.
          python -P -s -m midtermpanel.countcli

      # BEFORE the evidence upload, and `always()`, because the run this exists
      # for is the one where there is no evidence to upload. `continue-on-error`
      # so that bookkeeping can never be the step that turns an honest refusal
      # into a second, louder failure with a different cause.
      - name: Account for every provider attempt
        id: attempts
        if: always()
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/midterm/runtime
        run: |
          python -P -s -m midtermpanel.attemptscli

      - name: Retain the provider attempt journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: midterm-count-attempts-${{ needs.preflight.outputs.head_sha }}
          path: ${{ runner.temp }}/midterm/provider-attempts.jsonl
          # `ignore`, unlike the evidence below: a run that refused before its
          # first provider call correctly has no journal, and that is not an
          # error to report.
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain count evidence and the private plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: midterm-count-${{ needs.preflight.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/midterm/count-evidence.json
            ${{ runner.temp }}/midterm/executable-plan.json
          # A count job that emitted no private plan must not
          # leave a warning and let the panel proceed to a
          # download that finds nothing.
          if-no-files-found: error
          retention-days: 3

  # -------------------------------------------------------------------- panel
  panel:
    name: midterm-panel
    needs: [preflight, count]
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same reason as `count` — a different runner, a different RUNNER_TEMP.
    # These are the generation attempts, which is the number the run cap and
    # the operator's spend reconciliation are both about.
    outputs:
      provider_attempts: ${{ steps.attempts.outputs.provider_attempts }}
      generation_attempts: ${{ steps.attempts.outputs.generation_attempts }}
      journal_present: ${{ steps.attempts.outputs.journal_present }}
      accounting_complete: ${{ steps.attempts.outputs.accounting_complete }}
      accounting_state: ${{ steps.attempts.outputs.accounting_state }}
    permissions:
      contents: read
      actions: read
      checks: read
      # THE ONLY JOB IN THIS FILE WITH A SECOND WRITE SCOPE, and the only one
      # that may have it — `privilegedworkflow.assert_permissions` keys its
      # allowlist on the JOB ID, so the same two words in `preflight` or
      # `finalize` are a refusal rather than a widening.
      #
      # It exists so the panel can publish its findings where a person will
      # read them. A commit status carries a decision and 140 characters; it
      # cannot say which file, which lines, which model objected or why. A
      # governed panel that publishes only statuses is a reviewer nobody can
      # act on, which is how a real refutation becomes "the bot is broken,
      # merge it".
      #
      # Granted here rather than at the workflow level deliberately. The
      # top-level block stays `pull-requests: read`, so `preflight` — which
      # decides whether this run may proceed at all — and `finalize` — which
      # runs on every failure path including cancellation — still cannot write
      # to any pull request.
      #
      # The write is narrow by construction: `midtermpanel.reviewpublish`
      # builds every URL from the pinned repository numeric id and a validated
      # integer, and can create or edit exactly one marker-bearing comment.
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the hash-locked runtime
        run: |
          python -m pip install --require-hashes --no-deps \
            -r requirements-trusted-runtime.txt

      # The ONE permitted artifact download. It is same-run: no `run-id` and no
      # `github-token`, which is what makes `actions/download-artifact` unable
      # to reach any run but this one — in particular the candidate's CI run,
      # whose artifacts a pull request authored. `privilegedworkflow.py` permits
      # exactly this shape in exactly this job and refuses every other download.
      #
      # Rebuilding the plan instead is not an option: the plan carries the
      # provider's COUNTS, and a rebuild that does not call the provider has
      # nothing to compare them against.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: midterm-count-${{ needs.preflight.outputs.head_sha }}
          path: ${{ runner.temp }}/midterm/count-input

      - name: Materialise the approved engine release
        # The same governance document the count job read. The panel rebuilds
        # Stage 1 and `execute_review_plan` refuses when the rebuilt skeleton's
        # digest differs from the plan's — which is the check that catches a
        # candidate that moved between the two jobs.
        run: |
          python - >> "$GITHUB_ENV" <<'PROBE'
          import json
          doc = json.load(open("governance/midterm-panel-engine-release.json"))
          for key, variable in (
                  ("approved_engine_source_sha",
                   "MIDTERM_APPROVED_ENGINE_SOURCE_SHA"),
                  ("approved_engine_protected_sha",
                   "MIDTERM_APPROVED_ENGINE_PROTECTED_SHA"),
                  ("approved_engine_artifact_sha256",
                   "MIDTERM_APPROVED_ENGINE_ARTIFACT_SHA256"),
                  ("approved_engine_release_tag",
                   "MIDTERM_APPROVED_ENGINE_RELEASE_TAG"),
                  ("approved_engine_identity_sha256",
                   "MIDTERM_APPROVED_ENGINE_IDENTITY_SHA256")):
              if doc.get(key):
                  print(f"{variable}={doc[key]}")
          # Exported through a SEPARATE loop, because the loop above skips
          # falsy values and `native_branch_protection` is legitimately
          # `false` on this repository. Under the old guard the honest answer
          # would have been the one value that never reached the consumer,
          # which is the same shape of bug as the truthiness check in
          # `enginebuild.PROVENANCE_FIELDS`.
          for key, variable in (
                  ("native_branch_protection",
                   "MIDTERM_APPROVED_ENGINE_NATIVE_BRANCH_PROTECTION"),
                  ("control_class",
                   "MIDTERM_APPROVED_ENGINE_CONTROL_CLASS")):
              if key in doc:
                  value = doc[key]
                  if isinstance(value, bool):
                      value = "true" if value else "false"
                  print(f"{variable}={value}")
          PROBE

      - name: Assert the candidate is present as OBJECTS
        # NO FETCH. `actions/checkout` runs with `persist-credentials: false`,
        # which deliberately removes its token from every later git command —
        # and this repository is PRIVATE, so a later `git fetch` that has to
        # reach origin cannot authenticate.
        #
        # It does not need to. `fetch-depth: 0` makes the trusted checkout
        # fetch every branch's history while it still holds its own token, and
        # a same-repository pull request's head IS a branch in origin. Preflight
        # refuses a fork before this point precisely because that assumption is
        # what makes the objects present.
        #
        # The fetch this step replaced was measured, not guessed (git 2.43.0):
        # `git fetch --no-tags origin <sha>` exits 0 WITHOUT contacting the
        # remote when the object is already present, and exits 128 when it is
        # not. So it was a silent no-op whenever it was unnecessary, and a
        # mid-job failure — after the provider key had been read — in exactly
        # the cases it existed for.
        #
        # So this ASSERTS rather than acquires. A missing object is a named
        # failure here, before the provider key is read.
        #
        # `git cat-file -e` reads the object database and touches no worktree —
        # the object/worktree distinction that is this lane's whole safety
        # argument.
        env:
          CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          CANDIDATE_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          set -euo pipefail
          for sha in "$CANDIDATE_HEAD_SHA" "$CANDIDATE_BASE_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::candidate commit ${sha} is absent from the" \
                   "full-history checkout. This lane never fetches after" \
                   "checkout: the token is not persisted and the repository" \
                   "is private. A same-repository head should always be here." >&2
              exit 1
            fi
          done
          echo "MIDTERM_REPOSITORY_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Materialise the trusted runtime
        # WHY this exists, and why it is not a `cd`.
        #
        # `$GITHUB_WORKSPACE` is the CANDIDATE ROOT. The candidate's commits
        # are present in it as objects, and `engine.assert_no_candidate_path_is_importable`
        # refuses the run when any directory inside it is on `sys.path`,
        # because a candidate directory on the import path makes candidate
        # bytes importable — the one thing this lane's whole argument rests on
        # not being true.
        #
        # The committed invocation put it there TWICE: `PYTHONPATH` named
        # `<workspace>/scripts`, and `python -m` prepends the working
        # directory, which defaults to `<workspace>`. Panel run 31534191556 —
        # the first run ever authorised to spend — refused on exactly those
        # two entries, inside the job that already held the provider key.
        #
        # So the engine is materialised OUT of the repository before it is
        # imported. `git archive` reads the trusted commit's BLOBS rather than
        # the worktree, so what runs is what that commit holds even if a file
        # on disk differs. Only what the engine imports is materialised:
        # `midtermpanel` reaches into `trustedlane` for `enginebridge`,
        # `enginebuild` and `actionpolicy`, and a runtime holding only the
        # first imports and then fails.
        #
        # The THIRD path is a single top-level module, and it is not optional.
        # `panel._upstream()` does `import independent_verify` — the panel
        # deliberately reuses the default branch's policy implementation rather
        # than re-deriving `norm_reason`, `model_matches` and the approval rules
        # a second time. A runtime holding the two packages and not that file
        # imports, counts, sends every request, normalises every reply, and THEN
        # dies in `anti_copy_tripwire` with `ModuleNotFoundError: No module
        # named 'independent_verify'` — after the money is spent and before any
        # panel evidence is written. It is a FILE and not a package:
        # `scripts/independent_verify.py` under `--strip-components=1` extracts
        # to `<runtime>/independent_verify.py`, which is exactly where a
        # top-level import looks for it.
        #
        # The workspace keeps its one job: the git repository the review data
        # is read from. It simply stops being anywhere the interpreter looks
        # for code.
        env:
          CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          trusted="$(git rev-parse HEAD)"
          # The reviewer must not be the reviewed. This lane never checks the
          # candidate out, so this should be unreachable — which is why it is
          # asserted rather than assumed.
          if [ "$trusted" = "$CANDIDATE_HEAD_SHA" ]; then
            echo "::error::the trusted checkout is the candidate head" \
                 "${CANDIDATE_HEAD_SHA}; refusing to build the engine out of" \
                 "the code under review" >&2
            exit 1
          fi
          runtime="$RUNNER_TEMP/midterm/runtime"
          rm -rf "$runtime"
          mkdir -p "$runtime"
          git archive --format=tar "$trusted" \
            scripts/midtermpanel \
            scripts/trustedlane \
            scripts/independent_verify.py \
            | tar -x -C "$runtime" --strip-components=1
          for package in midtermpanel trustedlane; do
            if [ ! -f "$runtime/$package/__init__.py" ]; then
              echo "::error::${package} is missing from the materialised" \
                   "runtime; the engine imports both" >&2
              exit 1
            fi
          done
          # Asserted separately from the loop above because it is a MODULE and
          # not a package, and because the thing it protects happens late: the
          # import that needs it runs after every provider call has been paid
          # for. A missing file must fail here, before the key is read, and not
          # in `anti_copy_tripwire`.
          if [ ! -f "$runtime/independent_verify.py" ]; then
            echo "::error::independent_verify.py is missing from the" \
                 "materialised runtime; panel._upstream() imports it as a" \
                 "top-level module once every model has answered" >&2
            exit 1
          fi
          # An EMPTY directory to run from. `-P` keeps the working directory
          # off `sys.path` anyway; running somewhere with nothing in it means
          # the guarantee does not rest on that flag alone.
          mkdir -p "$RUNNER_TEMP/midterm/run"
          echo "MIDTERM_TRUSTED_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "MIDTERM_TRUSTED_RUNTIME_COMMIT=$trusted" >> "$GITHUB_ENV"

      # The panel needs this for the SAME reason the count job does, and it was
      # missing here. `panelcli.selected_generation_attempt_cap` reads the
      # generation cap out of the operator's selected profile rather than out
      # of a workflow literal — deliberately, so the cap cannot disagree with
      # `VERIFIER_MAX_GENERATION_CALLS`. That reader needs the PIN record, and
      # `$GITHUB_ENV` does not cross jobs, so the variable the count job
      # exported was simply absent here.
      #
      # Panel run 31844576977 is what that cost: preflight passed, the count
      # job made its real provider calls and produced evidence and a plan, and
      # then the panel job died with an opaque `exception_class=KeyError`
      # inside the credential-bearing step, having spent the count and produced
      # no verdict.
      #
      # Copied from the TRUSTED checkout, exactly as in `count`. This lane
      # never checks the candidate out, so `governance/` here is the default
      # branch's copy; the candidate cannot supply its own caps.
      #
      # The run challenge is deliberately NOT copied alongside it. The panel's
      # challenge comes from the PLAN — it is what the count job actually
      # counted — and minting a second one here would let the two disagree
      # while `require_approvals` still passed.
      - name: Materialise the operator PIN record
        run: |
          mkdir -p "$RUNNER_TEMP/midterm/inputs"
          cp governance/midterm-panel-pins.json \
            "$RUNNER_TEMP/midterm/inputs/pins.json"
          echo "MIDTERM_PIN_RECORD_PATH=$RUNNER_TEMP/midterm/inputs/pins.json" \
            >> "$GITHUB_ENV"

      # Materialise the operator-approved identity document BEFORE the step
      # that receives the provider key. GITHUB_TOKEN only: a download that
      # could also reach the provider is a download whose compromise costs
      # money. The module re-checks that ordering at runtime and refuses if a
      # provider secret is already in scope.
      #
      # The `if:` guard remains, and it is now the DRY-RUN path rather than
      # the current state: a release tag IS configured on main, so this step
      # runs. When no tag is configured — a dry run against unbound
      # governance — the step is skipped and provider mode refuses for the
      # missing identity path rather than proceeding, which is the honest
      # failure and not a silent downgrade.
      - name: Materialise the approved engine identity document
        if: env.MIDTERM_APPROVED_ENGINE_RELEASE_TAG != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
        run: python -m midtermpanel.releaseasset

      - name: Execute the governed panel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIDTERM_PANEL_PROVIDER_KEY: ${{ secrets.TRUSTED_VERIFIER_OPENAI_KEY }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          CANDIDATE_PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          CANDIDATE_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          HIGH_RISK_WORKFLOW_CHANGE: ${{ needs.preflight.outputs.high_risk }}
          MIDTERM_ENGINE_DIGEST: ${{ needs.preflight.outputs.engine_digest }}
          MIDTERM_POLICY_DIGEST: ${{ needs.preflight.outputs.policy_digest }}
          MIDTERM_REVIEW_CLASS: ${{ needs.preflight.outputs.review_class }}
          MIDTERM_TRIGGERING_CI_RUN_ID: ${{ needs.preflight.outputs.triggering_ci_run_id }}
          MIDTERM_TRIGGERING_CI_RUN_ATTEMPT: ${{ needs.preflight.outputs.triggering_ci_run_attempt }}
          MIDTERM_TESTED_BASE_SHA: ${{ needs.preflight.outputs.tested_base_sha }}
          MIDTERM_TESTED_HEAD_SHA: ${{ needs.preflight.outputs.tested_head_sha }}
          # Overrides the workflow-level PYTHONPATH, which names
          # `<workspace>/scripts` — a directory INSIDE the candidate
          # root. `Materialise the trusted runtime` put the same two
          # packages here, from the trusted commit's blobs.
          PYTHONPATH: ${{ runner.temp }}/midterm/runtime
        # NOT $GITHUB_WORKSPACE, which is where Actions would run this
        # by default: `-m` prepends the working directory to `sys.path`
        # and the workspace is the candidate root.
        working-directory: ${{ runner.temp }}/midterm/run
        run: |
          # `-P` does not prepend the working directory to `sys.path`;
          # `-s` leaves user site-packages out. NOT `-I`, which is the
          # obvious way to say "isolated" and is unusable here: it
          # implies `-E`, which would discard the PYTHONPATH above and
          # leave the trusted runtime unimportable.
          python -P -s -m midtermpanel.panelcli

      - name: Account for every provider attempt
        id: attempts
        if: always()
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/midterm/runtime
        run: |
          python -P -s -m midtermpanel.attemptscli

      - name: Retain the provider attempt journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: midterm-panel-attempts-${{ needs.preflight.outputs.head_sha }}
          path: ${{ runner.temp }}/midterm/provider-attempts.jsonl
          if-no-files-found: ignore
          retention-days: 3

      # BESIDE the cryptographic evidence, never instead of it. These two are
      # the SANITIZED reading of the panel's decision: `panel-review.md` is
      # byte-for-byte what was published to the pull request, and
      # `panel-review.json` is the structured object it was rendered from,
      # including which fields were withheld and why. Neither carries a reason's
      # proof, the execution challenge, or any raw provider text.
      #
      # `if-no-files-found: warn` and not `error`, unlike the evidence below: a
      # run that refused before it reached the publisher — a stale head, a
      # handoff mismatch — legitimately has no review to retain, and turning
      # that into a second failure would bury the first one.
      - name: Retain the sanitized readable review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: midterm-panel-review-${{ needs.preflight.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/midterm/panel-review.md
            ${{ runner.temp }}/midterm/panel-review.json
          if-no-files-found: warn
          retention-days: 3

      - name: Retain private verdict evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: midterm-panel-${{ needs.preflight.outputs.head_sha }}
          path: ${{ runner.temp }}/midterm/panel-evidence.json
          # A count job that emitted no private plan must not
          # leave a warning and let the panel proceed to a
          # download that finds nothing.
          if-no-files-found: error
          retention-days: 3

  # ----------------------------------------------------------------- finalize
  # Runs on EVERY path, including cancellation. NO SECRET IN SCOPE: this job
  # exists to make sure no status was left pending, and the one thing it must
  # never do is fail in a way that leaves a credential in a log.
  finalize:
    name: midterm-finalize
    needs: [preflight, count, panel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the hash-locked runtime
        run: |
          python -m pip install --require-hashes --no-deps \
            -r requirements-trusted-runtime.txt

      # There is no candidate to close out. Explicit and visible rather than
      # an empty step: "nothing to review" is an outcome, and a reader of this
      # run should be able to see which outcome it was without inferring it
      # from an absence.
      - name: Record that this run had nothing to review
        if: needs.preflight.outputs.proceed != 'true'
        env:
          APPLICABILITY: ${{ needs.preflight.outputs.applicability }}
          APPLICABILITY_REASON: ${{ needs.preflight.outputs.applicability_reason }}
        run: |
          printf '### midterm panel: no review\n\n%s\n\n%s\n' \
            "applicability: ${APPLICABILITY:-UNKNOWN}" \
            "${APPLICABILITY_REASON:-preflight did not proceed}" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "no candidate; provider_calls=0 generation_calls=0"

      - name: Close out every status and write the summary
        if: needs.preflight.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          CANDIDATE_PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          CANDIDATE_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          HIGH_RISK_WORKFLOW_CHANGE: ${{ needs.preflight.outputs.high_risk }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          # Not redundant with the `if:` above. `preflight_never_resolved_a_
          # candidate` distinguishes "preflight decided there was nothing to
          # review" from "an output went missing between jobs", and both are a
          # SUCCESSFUL preflight with a blank head. Passing it here means the
          # module is right on its own rather than only while that `if:` holds.
          PREFLIGHT_PROCEED: ${{ needs.preflight.outputs.proceed }}
          COUNT_RESULT: ${{ needs.count.result }}
          PANEL_RESULT: ${{ needs.panel.result }}
          # The attempt ledger, carried from the two jobs that could spend.
          # Reported even when neither wrote an evidence file, which is the
          # state panel run 31608202983 ended in.
          MIDTERM_COUNT_PROVIDER_ATTEMPTS: ${{ needs.count.outputs.provider_attempts }}
          MIDTERM_PANEL_PROVIDER_ATTEMPTS: ${{ needs.panel.outputs.provider_attempts }}
          MIDTERM_PANEL_GENERATION_ATTEMPTS: ${{ needs.panel.outputs.generation_attempts }}
          MIDTERM_COUNT_JOURNAL_PRESENT: ${{ needs.count.outputs.journal_present }}
          MIDTERM_PANEL_JOURNAL_PRESENT: ${{ needs.panel.outputs.journal_present }}
          # Whether the numbers above may be believed. Without these, an
          # unreadable ledger arrives as an empty string and would be reported
          # as zero — the fail-open this correction removes.
          MIDTERM_COUNT_ACCOUNTING_COMPLETE: ${{ needs.count.outputs.accounting_complete }}
          MIDTERM_PANEL_ACCOUNTING_COMPLETE: ${{ needs.panel.outputs.accounting_complete }}
          MIDTERM_COUNT_ACCOUNTING_STATE: ${{ needs.count.outputs.accounting_state }}
          MIDTERM_PANEL_ACCOUNTING_STATE: ${{ needs.panel.outputs.accounting_state }}
        run: |
          python -m midtermpanel.finalizecli
