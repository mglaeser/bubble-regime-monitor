# Independent cross-vendor PR review panel (mandate A-39, Article IV).
#
# THE INVARIANT THIS FILE EXISTS TO HOLD:
#   the reviewed artifact must never hold the reviewer's credentials, and
#   candidate code must never authenticate its own review.
#
# The predecessor ran `on: pull_request`, checked out the PR merge ref, and
# executed scripts/independent_verify.py FROM THAT CHECKOUT with the provider
# key in the environment. Opening a PR that edited that script was sufficient to
# run arbitrary code with the credential. That is a real defect, and it is why a
# 39,000-line "trusted lane" was built to work around it.
#
# It does not need 39,000 lines. It needs three properties, and this file has
# all three:
#
#   1. `pull_request_target` — the workflow DEFINITION is read from the default
#      branch, never from the pull request. A PR cannot edit its own reviewer.
#   2. `checkout` carries NO `ref:` — so the tree we execute is the default
#      branch's, i.e. reviewed code. THE CANDIDATE IS NEVER CHECKED OUT.
#   3. the candidate enters as INERT GIT OBJECTS via `git fetch` and is read
#      only through `git diff`. It is data, never an execution target.
#
# Because pull_request_target grants secrets to fork PRs too, and because the
# candidate diff is fed to a language model, fork-originated pull requests are
# NOT panel-reviewed automatically: they report failure and need a maintainer.
# Untrusted prose reaching a model that holds a merge verdict is a prompt-
# injection surface, and no amount of prompt hardening makes it a safe default.
#
# Under pull_request_target the check run attaches to the DEFAULT BRANCH, not to
# the pull request (verified: PR #58's panel check runs landed on main). So the
# verdict is POSTed as a commit status onto the candidate head explicitly —
# without that step this can never become a required status check.
#
# Actions are pinned to immutable commit SHAs, not moving tags: `@v4` is
# whatever that tag points at today, which is a supply-chain decision made by
# someone else at a time of their choosing.
name: Independent-Verify

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write        # required: see header — the check lands on main otherwise

concurrency:
  group: independent-verify-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  panel:
    runs-on: ubuntu-latest
    # Holds the provider credential. Its deployment-branch policy is `main`, so
    # the secret is unreachable from any ref a pull request can create.
    environment: trusted-verifier
    steps:
      # v4.4.0 — NO `ref:`. Checks out the DEFAULT BRANCH deliberately (header,
      # property 2). Adding `ref: ${{ github.event.pull_request.head.sha }}` here
      # would hand the candidate the credential and undo this entire file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Fetch the candidate as inert objects (never checked out, never run)
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/candidate"
          echo "candidate object present: $(git rev-parse refs/candidate)"

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      # Redaction covers the full base URL wherever it appears, but never the
      # pieces of it that surface on their own: the authority in a URL echo, the
      # bare hostname in a resolver failure, an unbracketed IPv6 literal in a
      # socket error. A mask matches one literal and nothing else, so each form
      # needs its own. Masks are job-scoped and apply only to lines written
      # after they register, so this has to run before the panel.
      #
      # A real parser rather than shell parameter expansion, because userinfo, a
      # port, a bracketed IPv6 literal, and a query with no path each defeat a
      # hand-rolled split -- and getting one wrong silently republishes the
      # endpoint that this step is the only thing hiding.
      - name: Mask the verifier endpoint in the log
        env:
          VERIFIER_BASE_URL: ${{ secrets.VERIFIER_BASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          raw = os.environ.get("VERIFIER_BASE_URL", "").strip()
          if not raw:
              # No gateway configured. The script falls back to the vendor
              # default and there is nothing endpoint-shaped to hide.
              sys.exit(0)

          try:
              parts = urlsplit(raw)
              if not parts.netloc:
                  # Scheme-less: urlsplit puts the whole value in path, so read
                  # it again as a network-relative reference.
                  parts = urlsplit("//" + raw)
              authority = parts.netloc
              hostport = authority.rsplit("@", 1)[-1]
              if hostport.startswith("[") and "]" in hostport:
                  host = hostport[: hostport.index("]") + 1]
              else:
                  host = hostport.split(":", 1)[0]
          except ValueError:
              host = ""

          if not host:
              # Fail closed. An endpoint we cannot parse is one we cannot promise
              # to redact, and the panel would print it moments later.
              print("::error::VERIFIER_BASE_URL is set but no host could be parsed from it; refusing to run the panel unmasked")
              sys.exit(1)

          forms = {authority, hostport, host}
          if host.startswith("[") and host.endswith("]"):
              # What a connection error prints, brackets being URL syntax.
              forms.add(host[1:-1])
          else:
              # A Unicode host is resolved under its IDNA form, and that form is
              # what a resolver or socket error names -- same host, a different
              # literal, so it needs its own mask. ASCII encodes to itself, so
              # this is a no-op for an ordinary hostname.
              try:
                  puny = host.encode("idna").decode("ascii")
              except (UnicodeError, ValueError):
                  puny = ""
              if puny:
                  forms.add(puny)
                  if hostport != host:
                      forms.add(puny + hostport[len(host) :])

          for form in sorted(forms):
              if not form:
                  continue
              # Case-folded as well: masks match literally, and a host can be
              # echoed back in a different case than it was configured in.
              for value in sorted({form, form.lower()}):
                  print(f"::add-mask::{value}")
          PY
      - name: Cross-vendor review panel
        id: panel
        # Fork PRs are refused rather than reviewed — see header.
        #
        # `success()` is spelled out, not left implicit. A custom `if` already
        # carries it by default, so a failed mask step already skips this one --
        # but that default is invisible at the point it matters, and what it is
        # holding here is the rule that the panel never runs, and so never prints
        # the endpoint, unless redaction was registered first.
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SECOND_VENDOR_API_KEY: ${{ secrets.TRUSTED_VERIFIER_API_KEY }}
          # A SECRET, not a `vars.` entry, and the difference is the whole point:
          # the runner echoes every env block into the log, redacting secrets
          # there and never variables. As a variable this published the gateway
          # endpoint in clear text, in a public log, on every panel run. As a
          # secret the runner also redacts it from whatever the script prints,
          # which is where the URL otherwise surfaces on a failed call.
          #
          # The repo VARIABLE of the same name is retired by this change. The
          # secret was set to the value that variable holds, and the variable is
          # deleted once this lands -- not before, because main's copy of this
          # file is what pull_request_target executes, so emptying it early would
          # starve every open PR's panel including the one carrying the fix.
          VERIFIER_BASE_URL: ${{ secrets.VERIFIER_BASE_URL }}
          # Gateways that reserve Authorization for upstream forwarding need a
          # different header; inference.klee.me answers Bearer with 401.
          VERIFIER_AUTH_HEADER: ${{ vars.VERIFIER_AUTH_HEADER }}
          VERIFIER_PANEL_MODELS: ${{ vars.VERIFIER_PANEL_MODELS }}
          VERIFIER_REQUIRED_APPROVER: ${{ vars.VERIFIER_REQUIRED_APPROVER }}
          VERIFIER_MIN_OTHER_APPROVERS: ${{ vars.VERIFIER_MIN_OTHER_APPROVERS }}
          VERIFIER_STRICT_ANY_REFUTATION: "true"
          # Require every APPROVING voice to carry a machine-readable "defects"
          # ledger, and block when that ledger contradicts the boolean. Hardcoded
          # rather than a repo variable for the same reason as the line above: a
          # merge control that a variable can silently switch off is not a control.
          # Compliance measured against all three panel groups before enabling --
          # planted defect: 3/3 refuted with a populated ledger; clean diff: empty
          # ledgers. Set to "false" only in a fork whose models do not answer it.
          VERIFIER_REQUIRE_DEFECT_LIST: "true"
          # Explicit range. The job runs from the default branch, where HEAD IS
          # main — without these two the diff collapses to main...main, comes
          # back empty, and the panel goes permanently fake-green.
          VERIFIER_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          VERIFIER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A missing key is the operator's documented residual on a same-repo
          # PR, but never a silent pass when a credential was expected.
          VERIFIER_REQUIRE_KEY: "true"
        run: python scripts/independent_verify.py

      - name: Publish the verdict onto the candidate head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.panel.outcome }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            state=failure
            desc="fork PR: panel not run — maintainer review required"
          elif [ "$OUTCOME" = "success" ]; then
            state=success
            desc="cross-vendor panel approved"
          else
            state=failure
            desc="cross-vendor panel refused — see job log"
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context="independent-verify" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f description="$desc"
          [ "$state" = "success" ] || exit 1
