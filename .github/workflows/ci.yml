name: ci

# Audit rebuild (A-01/A-08/A-13/B-01/B-35): the previous pipeline was red on
# every run and non-blocking ('mypy || true'), so production shipped on red.
# This version fails closed on lint, tests, dependency CVEs and secret leaks.
# Type-checking is EXPLICITLY advisory — not disguised as a gate — until the
# tracked mypy errors are driven to zero (A-13). The count is RATCHETED: it may
# fall, never rise. ("43 tracked errors" stood here and was wrong; the measured
# figure was 217 in 49 files. A stale number in a governance comment is the
# same defect class as a decorative gate — it reads as control and is not.)
#
# ENFORCEMENT (this note is a claim about the repository, so it is kept true):
# a ruleset on `main` marks `test (3.12)` and `image` REQUIRED, with no bypass
# actors, and a direct push to main is rejected. That closes the open item this
# note used to describe.

on:
  push:
    # main only. A pull request already runs everything below; leaving `push`
    # unrestricted ran the whole suite twice for every branch commit.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0          # full history so the secret scan sees every commit
      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python deps (aligned to pyproject; anthropic+xlrd added)
        run: |
          python -m pip install --upgrade pip "setuptools>=83"   # setuptools>=83 clears PYSEC-2026-3447
          pip install fastapi "uvicorn[standard]" "pydantic>=2.7" pydantic-settings \
            SQLAlchemy alembic httpx tenacity "APScheduler<4" structlog slowapi \
            "numpy<2.3" "pandas<3.0" openpyxl xlrd beautifulsoup4 lxml anthropic PyYAML \
            pytest ruff mypy pip-audit detect-secrets
      - name: Install optional LPPLS engine (best-effort; suite skips it if absent)
        run: pip install "lppls==0.6.24" || echo "::warning::lppls unavailable — LPPLS paths self-skip (hermetic suite, A-02)"
      - name: Lint (ruff, BLOCKING — E,F,I,W,UP,B,S)
        run: ruff check app tests scripts
      - name: Type-check (RATCHET — the error count may fall, never rise; A-13)
        # Not continue-on-error. The error COUNT is the gate: driving it to zero
        # is A-13's job, but nothing may add to it in the meantime. Lower the
        # ceiling in the same commit that lowers the count.
        env:
          # 217 -> 212: annotating the four frozen s4 policy constants as float
          # cleared the whole no-any-return class in app/indicators/s4_gsadf.py.
          # Lowered in the SAME commit that lowered the count, which is what the
          # comment below has always asked for and what the ::notice:: advises.
          MYPY_CEILING: "212"
          # The floor constrains REACH, not DEPTH: it proves mypy READ the tree.
          # It does NOT make a low count mean "little is wrong" -- an earlier
          # version of this comment claimed that, and it is false. Measured:
          # flipping `strict = true` to false in pyproject.toml drops 217 errors
          # to 84 with the file count unchanged at 113 and this floor satisfied.
          # 113 files today; the floor sits below that so ordinary file movement
          # does not trip it.
          MYPY_MIN_FILES: "100"
          # DEPTH is pinned separately, because the ratchet only ever blocks a
          # RISE -- so a config loosening lowers the count, passes, and then
          # invites lowering the ceiling to match, locking the loosening in.
          # Same shape as the byte-identical .secrets.baseline: [tool.mypy] is
          # pinned in .mypy-config.pinned, and changing it fails the build until
          # that file is updated in the same commit, deliberately.
        run: |
          python -c "import pathlib,re; s=pathlib.Path('pyproject.toml').read_text(); m=re.search(r'(?ms)^\[tool\.mypy\].*?(?=^\[(?!tool\.mypy)|\Z)', s); pathlib.Path('/tmp/mypy-config.actual').write_text(m.group(0).rstrip()+chr(10) if m else 'MISSING')"
          if ! diff -u <(grep -v '^#' .mypy-config.pinned | sed '/^$/d') /tmp/mypy-config.actual; then
            echo "::error::[tool.mypy] no longer matches .mypy-config.pinned."
            echo "::error::This gate counts errors; it cannot see strictness. Re-derive"
            echo "::error::MYPY_CEILING under the new config and update both in one commit."
            exit 1
          fi
          set +e
          mypy app > /tmp/mypy.txt 2>&1
          rc=$?
          set -e
          tail -1 /tmp/mypy.txt
          # A COUNT OF ERROR LINES IS NOT A MEASURE OF WORK DONE. Two ways this
          # gate passed while type-checking nothing, both reproduced:
          #   mypy absent          -> rc 127, no output, "mypy errors: 0" -> PASSED,
          #                           and advised lowering the ceiling to 0.
          #   target path moved    -> rc 2, "errors prevented further checking",
          #                           "mypy errors: 1"  -> PASSED at 1, advising a
          #                           ceiling of 1 -- which then makes RESTORING
          #                           real checking fail the build at 217.
          # rc 0 and 1 are verdicts (clean / errors found). Anything else means
          # mypy could not run, and an unrunnable checker is a refusal, never a
          # low score. Fail-closed, as every other gate in this file.
          if [ "$rc" -ge 2 ]; then
            echo "::error::mypy exited $rc without type-checking the tree — this is a refusal, not a pass."
            cat /tmp/mypy.txt
            exit 1
          fi
          checked=$(grep -oE '[0-9]+ source files?' /tmp/mypy.txt | tail -1 | grep -oE '^[0-9]+' || true)
          checked=${checked:-0}
          echo "mypy checked $checked source files (floor $MYPY_MIN_FILES)"
          if [ "$checked" -lt "$MYPY_MIN_FILES" ]; then
            echo "::error::mypy checked only $checked source files, below the floor $MYPY_MIN_FILES."
            echo "::error::The error count below is not trustworthy — mypy did not read the tree."
            cat /tmp/mypy.txt
            exit 1
          fi
          n=$(grep -cE '^[^ ].*: error:' /tmp/mypy.txt || true)
          echo "mypy errors: $n (ceiling $MYPY_CEILING)"
          if [ "$n" -gt "$MYPY_CEILING" ]; then
            echo "::error::mypy errors rose to $n, above the ratchet ceiling $MYPY_CEILING."
            grep -E '^[^ ].*: error:' /tmp/mypy.txt | head -40
            exit 1
          fi
          if [ "$n" -lt "$MYPY_CEILING" ]; then
            echo "::notice::mypy errors fell to $n — lower MYPY_CEILING to $n to pin the gain."
          fi
      - name: Security — dependency audit (BLOCKING)
        run: pip-audit --progress-spinner off
      - name: Security — secret scan over tracked files (BLOCKING)
        # NB: `detect-secrets scan --baseline` exits 0 even on NEW secrets (it just
        # re-emits an updated baseline) — it does NOT gate. `detect-secrets-hook`
        # exits 1 when a tracked file contains a secret absent from the baseline.
        # (This distinction was caught by adversarial verification.)
        #
        # SCOPE — this is an INDEX-TIME control, not a presence check. The input
        # is `git ls-files`, so an UNTRACKED file is invisible to it: the gate is
        # green for the whole life of a new file before `git add`, which is
        # exactly the window in which a pasted credential is most likely to be
        # sitting in one. Reproduced: a new test file containing a fake
        # "ANTHROPIC_API_KEY" passed while untracked and failed on commit.
        # A green run here means "no new secret in the index", never "no secret
        # in the working tree".
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Alert artifacts — validate the shipped ruleset + phrase set (BLOCKING)
        # The rule inventory is DATA. A ruleset that no longer validates is a
        # silently-dark alert system, so this gates the same as a test failure.
        run: python -m app.alerts.cli validate --rules config/alert_rules.v3.2.yaml --phrases config/alert_phrases.v3.2.json
        env:
          TESTING: "true"
      - name: Alert OpenAPI artifact — no drift (BLOCKING)
        run: python -m scripts.export_alert_openapi --check
        env:
          TESTING: "true"
      - name: Alert Stage 1 gate — deterministic replay (BLOCKING)
        # THE Stage 1 gate, enforced rather than attested. The committed
        # evidence was produced by a different process on a different machine;
        # if replay stops being deterministic, this stops matching.
        run: python -m scripts.export_alert_stage1_gate --check
        env:
          TESTING: "true"
      - name: Tests (BLOCKING)
        # -rs prints the reason for every skip. Without it a hosted run reports
        # "N passed, 5 skipped" and nobody can tell whether the five are
        # structural preconditions or coverage that quietly stopped running.
        run: pytest -q -rs

      # ---- Level 2 regime gates -------------------------------------------
      # Each is executable, blocking, and carries its own --selftest. No
      # `|| true`, no continue-on-error: an override path that exists is a gate
      # that does not exist.
      - name: Regime — gate/gated separation (B-35, BLOCKING)
        run: |
          python -m scripts.regime.separation_check --selftest
          python -m scripts.regime.separation_check
      - name: Regime — authorisation coverage (C-01, BLOCKING)
        run: |
          python -m scripts.regime.authz_coverage --selftest
          python -m scripts.regime.authz_coverage
      - name: Regime — findings ledger (report during remediation)
        # Deliberately the reporting mode, not --strict: 4 STOP-SHIP and 11
        # BLOCKER-1 findings are open and being worked. --strict turns on in
        # WP9 once they reach zero. A gate that can never pass is a gate
        # someone deletes under pressure; this one states the tally instead.
        run: python -m scripts.regime.findings_gate --selftest && python -m scripts.regime.findings_gate

  deploy-admission-proof:
    # A job whose GREEN CONDITION IS THE REFUSAL. It proves the deploy gate
    # actually fails closed, rather than trusting that it would — the failure
    # mode being guarded against is an admission check that silently starts
    # returning 0 and is never noticed because nothing ever exercises it.
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Deploy admission MUST refuse while production_eligible is false
        run: |
          if python -m scripts.regime.findings_gate --admission; then
            echo "::error::Admission was GRANTED while blocking findings are open."
            exit 1
          fi
          echo "Admission correctly refused (fail-closed)."

  image:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Runner lacks rootless Podman wiring; the Containerfile is OCI-compatible,
      # so docker build is the documented substitute (spec section 12).
      - name: Build image (validates the Containerfile incl. R/exuber)
        run: docker build -t bubblegauge -f Containerfile .
