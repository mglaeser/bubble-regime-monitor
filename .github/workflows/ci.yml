name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install R (for GSADF/exuber subprocess)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" "pydantic>=2.7" pydantic-settings \
            SQLAlchemy alembic httpx tenacity "APScheduler<4" structlog slowapi \
            numpy pandas openpyxl beautifulsoup4 lxml pyarrow pytest ruff mypy
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Type-check (mypy)
        run: mypy app || true   # strict gate tracked; do not silently drop failures from logs
      - name: Tests
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runner lacks rootless Podman wiring; the Containerfile is OCI-compatible,
      # so docker build is the documented substitute (spec section 12).
      - name: Build image
        run: docker build -t bubblegauge -f Containerfile .
