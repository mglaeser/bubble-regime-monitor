name: ci

# Audit rebuild (A-01/A-08/A-13/B-01/B-35): the previous pipeline was red on
# every run and non-blocking ('mypy || true'), so production shipped on red.
# This version fails closed on lint, tests, dependency CVEs and secret leaks.
# Type-checking is EXPLICITLY advisory (continue-on-error) — not disguised as a
# gate — until the 43 tracked mypy errors are driven to zero (A-13).
#
# NOTE (honesty, per the mandate): making this the *authoritative* gate also
# requires branch protection to mark `test` a REQUIRED status check with no
# bypass. That is a repo-settings action for the human-in-command (B-35), and
# it is recorded as an open item in audit/06-residual-risk-register.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0          # full history so the secret scan sees every commit
      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python deps (aligned to pyproject; anthropic+xlrd added)
        run: |
          python -m pip install --upgrade pip "setuptools>=83"   # setuptools>=83 clears PYSEC-2026-3447
          pip install fastapi "uvicorn[standard]" "pydantic>=2.7" pydantic-settings \
            SQLAlchemy alembic httpx tenacity "APScheduler<4" structlog slowapi \
            "numpy<2.3" "pandas<3.0" openpyxl xlrd beautifulsoup4 lxml anthropic PyYAML \
            pytest ruff mypy pip-audit detect-secrets
      - name: Install optional LPPLS engine (best-effort; suite skips it if absent)
        run: pip install "lppls==0.6.24" || echo "::warning::lppls unavailable — LPPLS paths self-skip (hermetic suite, A-02)"
      - name: Lint (ruff, BLOCKING — E,F,I,W,UP,B,S)
        run: ruff check app tests scripts
      - name: Type-check (ADVISORY — 43 tracked errors, A-13; not a gate yet)
        run: mypy app
        continue-on-error: true
      - name: Security — dependency audit (BLOCKING)
        run: pip-audit --progress-spinner off
      - name: Security — secret scan over tracked files (BLOCKING)
        # NB: `detect-secrets scan --baseline` exits 0 even on NEW secrets (it just
        # re-emits an updated baseline) — it does NOT gate. `detect-secrets-hook`
        # exits 1 when a tracked file contains a secret absent from the baseline.
        # (This distinction was caught by adversarial verification.)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Alert artifacts — validate the shipped ruleset + phrase set (BLOCKING)
        # The rule inventory is DATA. A ruleset that no longer validates is a
        # silently-dark alert system, so this gates the same as a test failure.
        run: python -m app.alerts.cli validate --rules config/alert_rules.v3.2.yaml --phrases config/alert_phrases.v3.2.json
        env:
          TESTING: "true"
      - name: Alert OpenAPI artifact — no drift (BLOCKING)
        run: python -m scripts.export_alert_openapi --check
        env:
          TESTING: "true"
      - name: Alert Stage 1 gate — deterministic replay (BLOCKING)
        # THE Stage 1 gate, enforced rather than attested. The committed
        # evidence was produced by a different process on a different machine;
        # if replay stops being deterministic, this stops matching.
        run: python -m scripts.export_alert_stage1_gate --check
        env:
          TESTING: "true"
      - name: Tests (BLOCKING)
        # -rs prints the reason for every skip. Without it a hosted run reports
        # "N passed, 5 skipped" and nobody can tell whether the five are
        # structural preconditions or coverage that quietly stopped running.
        run: pytest -q -rs

  image:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Runner lacks rootless Podman wiring; the Containerfile is OCI-compatible,
      # so docker build is the documented substitute (spec section 12).
      - name: Build image (validates the Containerfile incl. R/exuber)
        run: docker build -t bubblegauge -f Containerfile .
