# Trusted capability probe for the cross-vendor verifier's token accounting.
#
# WHY THIS EXISTS, AND WHY IT LIVES ON THE DEFAULT BRANCH
# ------------------------------------------------------
# The planned intra-file review planner (P0-02) must size every review request
# against a REAL provider token count rather than a local estimate: tiktoken
# publishes no encoding mapping for `gpt-5.3-codex` or `gpt-5.6-sol`, and its
# encoding constructors fetch BPE assets over the network, so any local count
# would be a guess dressed up as a measurement. The planner therefore depends
# on POST /v1/responses/input_tokens, and that dependency has to be PROVEN
# against the real account before it is designed in.
#
# The open V-TRUST residual is precisely that pull-request-controlled code can
# receive the verifier credential. Proving this capability from a branch under
# review would reproduce that exact defect for no reason.
#
# WHAT ACTUALLY PINS THIS TO THE DEFAULT BRANCH (corrected after the panel's
# required approver refuted the first version of this file):
#
# `workflow_dispatch` does NOT restrict which ref runs. The workflow must exist
# on the default branch to be DISPATCHABLE, but the dispatch call takes a `ref`
# and GitHub then runs THAT REF'S VERSION of this file, with secrets available.
# So anyone able to push a branch could copy this workflow, delete the guards
# below, add exfiltration, dispatch their ref, and receive the credential. No
# `if:` condition here can prevent that, because every such condition lives in
# the very file the attacker rewrites — a guard cannot defend itself.
#
# The enforcement therefore CANNOT live in this file. It lives in WHERE THE KEY
# IS STORED: the job below declares `environment: verifier-probe`, and that
# environment must be configured (operator console) with a deployment-branch
# policy admitting ONLY the default branch, holding the probe key as an
# ENVIRONMENT secret. Then a branch-modified copy that keeps `environment:` is
# refused by the branch policy, and a copy that deletes `environment:` gets no
# key at all, because the key exists nowhere else. For the same reason there is
# deliberately NO repository-level secret fallback: a repo-level secret is
# readable from ANY ref and would silently defeat the environment policy.
#
# Until that environment exists with that policy, this probe is NOT pinned to
# the default branch and its evidence is NOT trustworthy. The guards below are
# defence-in-depth only and are NOT a security boundary.
#
# This workflow additionally:
#
#   * performs NO checkout, so no repository code, dependency, config or hook
#     from any branch is ever executed with the key in scope;
#   * sends a FIXED SYNTHETIC payload — no diff, no file content, no
#     repository data of any kind leaves the runner;
#   * calls NO generation endpoint (no /v1/responses), only model retrieval
#     and the input-token counter;
#   * prints sanitized evidence only: status codes, the returned model id, the
#     token count, and locally derived operation ids. Provider request and
#     response identifiers are NEVER read or persisted — they are
#     provider-controlled strings, and a shape rule cannot prove such a string
#     is not a key fragment. Never the key, never headers.
#
# WHAT A GREEN RUN PROVES (and nothing more) is recorded in
# docs/VERIFIER_CAPABILITY_PROBE.md. In particular it does NOT close V-TRUST:
# a durable independent verifier still needs a separately operated runner that
# treats the application pull request as inert data.

name: OpenAI verifier capability probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-verifier-capability-probe
  cancel-in-progress: false

jobs:
  probe:
    # DEFENCE IN DEPTH ONLY — NOT a security boundary. An attacker dispatching
    # a modified copy of this file from their own ref simply deletes these
    # lines. The real control is the `environment:` deployment-branch policy
    # below (see the header). Kept because it cheaply blocks accidental
    # dispatch from a fork or by a non-operator on the default-branch copy.
    if: >-
      github.repository == 'mglaeser/bubble-regime-monitor' &&
      github.actor == 'mglaeser'
    # THE ACTUAL CONTROL. This environment must be configured in the operator
    # console with a deployment-branch policy admitting ONLY the default
    # branch, and must hold OPENAI_VERIFIER_PROBE_API_KEY as an ENVIRONMENT
    # secret. Until then this job cannot obtain a key and will fail closed.
    environment: verifier-probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Environment secret ONLY. There is deliberately no
      # `|| secrets.OPENAI_API_KEY` fallback: a repository-level secret is
      # readable from ANY ref, so the fallback would defeat the environment's
      # deployment-branch policy and reopen exactly the hole this closes.
      OPENAI_API_KEY: ${{ secrets.OPENAI_VERIFIER_PROBE_API_KEY }}
      OPENAI_BASE_URL: https://api.openai.com/v1
      WORKFLOW_SHA: ${{ github.sha }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      WORKFLOW_JOB: ${{ github.job }}

    steps:
      - name: Probe exact models and Responses input-token endpoint
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::No probe API key. Configure the 'verifier-probe' environment with a default-branch-only deployment policy and add OPENAI_VERIFIER_PROBE_API_KEY as an ENVIRONMENT secret. Do not add a repository-level fallback: it is readable from any ref and would defeat the branch policy."
            exit 1
          fi

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          BASE = os.environ["OPENAI_BASE_URL"].rstrip("/")
          KEY = os.environ["OPENAI_API_KEY"]

          # The exact panel identities the planner will size requests for.
          MODELS = (
              "gpt-5.3-codex",
              "gpt-5.6-sol",
              "gpt-4.1-mini",
          )

          # Fixed and synthetic on purpose: this probe must never carry
          # repository content to the provider.
          FIXED_INSTRUCTIONS = (
              "Capability probe only. Count this fixed synthetic request. "
              "Do not generate a response."
          )
          FIXED_INPUT = "bubblegauge verifier input-token capability probe"

          def canonical_json(value: Any) -> bytes:
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")

          # Repository-owned static diagnostics. These three strings are the
          # ONLY prose that can reach a log line from an error path, and all
          # three are authored here.
          _NON_OBJECT = "provider returned a non-object error response"
          _NO_STRUCTURED = "provider returned no structured error object"
          _STRUCTURED = "provider returned a structured error"

          def safe_error(body: Any) -> dict[str, Any]:
              """Emit a repository-owned diagnostic and NOTHING provider-controlled.

              History, because it explains why this is so blunt:

              v1 passed the provider's `error.message` through truncated to 300
              characters. On an authentication failure OpenAI embeds its own
              partially-redacted echo of the submitted key in that message
              ("Incorrect API key provided: XXXXXXXX******XXXX"), so a key
              fingerprint reached the workflow log on run 30214247762.

              v2 dropped `message` but still forwarded `type`, `code` and
              `param` whenever they were at most 64 characters and contained no
              whitespace. That is a SHAPE filter, not an allowlist: a short
              no-whitespace secret fragment — `sk-proj-abcdef123456`,
              `Bjufbiyf`, `itvb` — passes it unchanged. The smuggling test
              missed this because its fixture was a full sentence, and
              sentences contain spaces.

              v3 (this one) emits no provider-controlled value at all. Proving
              that a model is retrievable and countable does not require the
              provider's error vocabulary, so the safest allowlist is the empty
              one: whatever the provider puts in any error field, none of it can
              reach the log. The caller adds only repository-owned or
              separately VALIDATED values — HTTP status, operation name, the
              requested model id, and a locally derived operation id.

              If provider identifiers are ever genuinely needed, they must be
              checked against finite repository-owned sets (_ALLOWED_TYPES and
              friends), never against a length or character-class rule."""
              if not isinstance(body, dict):
                  return {"diagnostic": _NON_OBJECT}
              if not isinstance(body.get("error"), dict):
                  return {"diagnostic": _NO_STRUCTURED}
              return {"diagnostic": _STRUCTURED}

          def local_operation_id(model: str, operation: str,
                                 payload_sha256: str | None) -> str:
              """A correlation id built ENTIRELY from repository-owned values.

              This replaces the provider's x-request-id. A previous revision
              accepted that header if it matched ^[A-Za-z0-9._:-]{1,128}$ and
              emitted it verbatim — but "sk-proj-abcdef123456" satisfies that
              pattern exactly, so the "validated" identifier was a disclosure
              channel. That was the SECOND shape filter in this file to be
              defeated by a short, whitespace-free secret; the first was the
              64-character rule on error type/code/param.

              A regex can only prove shape. It cannot prove that arbitrary
              provider-controlled text is not a key, a key fragment, a bearer
              token, a customer identifier, or repository content. So no
              provider identifier is persisted at all: correlation uses the
              requested model, the operation name, the payload hash, the
              workflow SHA, the run id and the position in the results array —
              every one of which this repository already owns."""
              return hashlib.sha256(canonical_json({
                  "schema_version": 1,
                  "model": model,
                  "operation": operation,
                  "payload_sha256": payload_sha256,
              })).hexdigest()

          def request(
              method: str,
              path: str,
              payload: dict[str, Any] | None = None,
          ) -> tuple[int, Any]:
              """Returns (status, parsed_body) — deliberately NO third element.

              Response HEADERS are never read. Removing the read at the source,
              rather than sanitising downstream, is what makes the channel
              closed: there is no provider identifier in scope to leak, so a
              future edit cannot reintroduce one by accident."""
              data = canonical_json(payload) if payload is not None else None
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      try:
                          parsed = json.loads(raw)
                      except json.JSONDecodeError:
                          parsed = {"_invalid_json": True}
                      return response.status, parsed
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      parsed = json.loads(raw)
                  except json.JSONDecodeError:
                      parsed = {"_invalid_json": True}
                  return exc.code, parsed

          results: list[dict[str, Any]] = []
          failed = False

          for requested_model in MODELS:
              encoded_model = urllib.parse.quote(requested_model, safe="")

              model_status, model_body = request(
                  "GET",
                  f"/models/{encoded_model}",
              )
              retrieved_model_id = (
                  model_body.get("id")
                  if isinstance(model_body, dict)
                  else None
              )

              payload = {
                  "model": requested_model,
                  "instructions": FIXED_INSTRUCTIONS,
                  "input": FIXED_INPUT,
                  "truncation": "disabled",
              }
              payload_sha256 = hashlib.sha256(
                  canonical_json(payload)
              ).hexdigest()

              count_status, count_body = request(
                  "POST",
                  "/responses/input_tokens",
                  payload,
              )

              count_object = (
                  count_body.get("object")
                  if isinstance(count_body, dict)
                  else None
              )
              input_tokens = (
                  count_body.get("input_tokens")
                  if isinstance(count_body, dict)
                  else None
              )

              model_ok = (
                  model_status == 200
                  and retrieved_model_id == requested_model
              )
              # bool is a subclass of int — exclude it explicitly so `true`
              # cannot masquerade as a token count of 1.
              count_ok = (
                  count_status == 200
                  and count_object == "response.input_tokens"
                  and isinstance(input_tokens, int)
                  and not isinstance(input_tokens, bool)
                  and input_tokens >= 0
              )

              if not (model_ok and count_ok):
                  failed = True

              # NO provider-controlled string is recorded. Each is reduced to a
              # comparison against a repository-owned expectation, and
              # correlation uses a locally derived operation id rather than the
              # provider's request id. Emitting the EXPECTED value on a match
              # (and nothing on a mismatch) carries the same information with
              # no channel.
              results.append({
                  "requested_model_id": requested_model,
                  "model_retrieve": {
                      "status": model_status,
                      # the exact requested id when it matched, else null —
                      # never an arbitrary provider-supplied identifier
                      "returned_id": requested_model if model_ok else None,
                      "returned_id_matches": retrieved_model_id == requested_model,
                      "local_operation_id": local_operation_id(
                          requested_model, "models.retrieve", None),
                      "ok": model_ok,
                      "error": None if model_ok else safe_error(model_body),
                  },
                  "input_token_count": {
                      "status": count_status,
                      # a boolean, not the raw object string
                      "object_matches": count_object == "response.input_tokens",
                      # Only a validated non-negative int is recorded. This
                      # field is provider-controlled too: a body carrying
                      # {"input_tokens": "<secret>"} would previously have been
                      # written straight into the evidence JSON on the failure
                      # path, where count_ok is False and the value was emitted
                      # anyway.
                      "input_tokens": input_tokens if count_ok else None,
                      "local_operation_id": local_operation_id(
                          requested_model, "responses.input_tokens",
                          payload_sha256),
                      "payload_sha256": payload_sha256,
                      "ok": count_ok,
                      "error": None if count_ok else safe_error(count_body),
                  },
              })

          evidence = {
              "schema_version": 1,
              "probe_type": "OPENAI_RESPONSES_INPUT_TOKEN_CAPABILITY",
              "generation_calls": 0,
              "base_url": BASE,
              "workflow_sha": os.environ.get("WORKFLOW_SHA"),
              "workflow_run_id": os.environ.get("WORKFLOW_RUN_ID"),
              "workflow_job": os.environ.get("WORKFLOW_JOB"),
              "probed_at": datetime.now(timezone.utc).isoformat(),
              "results": results,
              "overall_ok": not failed,
          }

          rendered = json.dumps(
              evidence,
              indent=2,
              sort_keys=True,
              ensure_ascii=False,
          )
          print(rendered)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text(
                  "## OpenAI verifier capability probe\n\n"
                  "No generation endpoint was called.\n\n"
                  "```json\n"
                  + rendered
                  + "\n```\n",
                  encoding="utf-8",
              )

          # Fail closed: a missing or malformed result for ANY required model
          # must not read as a capability that the planner may rely on.
          if failed:
              sys.exit(1)
          PY
