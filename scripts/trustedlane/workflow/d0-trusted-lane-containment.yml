# D0 — trusted verifier lane containment check. NO SECRET, NO PROVIDER CALL.
#
# This is the ONLY trusted-lane workflow intended for deployment into
# .github/workflows/ at this stage. D1 (trusted count) and D2 (trusted
# generation) live beside it as `.yml.template` files precisely so that copying
# this directory into the workflows directory cannot activate them: GitHub only
# reads `.yml`/`.yaml` there.
#
# What this job is for: proving, on a hosted runner, from protected code, that
# the containment invariants hold — repository identity, protected ref, phase
# ceiling, candidate isolation. It declares no `environment:`, so no environment
# secret is reachable, and it names no secret at all.
#
# Every third-party action is pinned to an immutable commit SHA. A moving tag is
# a supply-chain hole in a lane whose entire purpose is deciding what is allowed
# to run: `@v4` is whatever the tag points at the moment the runner resolves it,
# and the owner of that tag is not the owner of this repository.
#
#   actions/checkout        11d5960a326750d5838078e36cf38b85af677262  (v4.4.0)
#   actions/setup-python    a26af69be951a213d495a4c3e4e4022e16d87065  (v5.6.0)
#
# Both mappings were resolved with `git ls-remote` against the upstream
# repositories and each SHA carries a concrete release tag as well as the moving
# tag; the mapping is recorded in scripts/trustedlane/actionpolicy.py and
# asserted by tests.

name: trusted-lane-d0-containment

# workflow_dispatch takes NO ref-selecting input: if the caller picks the ref,
# the caller picks the code. The GitHub-level ref a dispatch runs from is
# constrained by branch/environment rulesets and re-checked at runtime by
# identity.assert_protected_ref.
#
# Deliberately absent: pull_request_target (runs the base definition with
# secrets against a head the PR controls), issue_comment and workflow_run (the
# same exposure through a different door). workflowpolicy.FORBIDDEN_TRIGGERS
# refuses all three and a test asserts this file uses none of them.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'scripts/trustedlane/**'
      - '.github/workflows/d0-trusted-lane-containment.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  d0-containment:
    runs-on: ubuntu-latest
    # No `environment:`. That is the load-bearing line in this file — an
    # environment is what makes an environment secret reachable, and this job
    # must not be able to reach one even by accident.
    permissions:
      contents: read
    steps:
      - name: Check out the trusted lane from the protected ref only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # No `ref:` — the tree is exactly the ref this run was dispatched
          # from, which assert_protected_ref then re-verifies. A `ref:` taken
          # from an input would let the dispatcher swap the code.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install test dependencies only
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Verify repository identity, protected ref, and phase ceiling
        env:
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          OBSERVED_REF: ${{ github.ref }}
        run: |
          python - <<'PROBE'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from trustedlane import identity, phases
          identity.assert_repository_numeric_id(int(os.environ["EVENT_REPOSITORY_ID"]))
          identity.assert_protected_ref(os.environ["OBSERVED_REF"])
          print(json.dumps({
              "repository_id_verified": True,
              "ref": os.environ["OBSERVED_REF"],
              "capabilities": phases.assert_phase_permitted(phases.D0),
          }, sort_keys=True))
          PROBE

      - name: Prove candidate isolation in this process
        run: |
          python - <<'PROBE'
          import json, sys
          sys.path.insert(0, "scripts")
          from trustedlane import enginepolicy
          print(json.dumps(enginepolicy.assert_no_candidate_import(),
                           sort_keys=True))
          PROBE

      - name: Prove the credential-bearing gates all refuse
        run: |
          python - <<'PROBE'
          import sys
          sys.path.insert(0, "scripts")
          from trustedlane import errors, phases, prerequisites
          refused = []
          for label, call in (
              ("D1", lambda: phases.assert_phase_permitted(phases.D1)),
              ("D2", lambda: phases.assert_phase_permitted(phases.D2)),
              ("real_calls", lambda: prerequisites.assert_real_calls_authorized(
                  prerequisites.prerequisite_status())),
              ("generation", lambda: prerequisites.assert_generation_authorized(
                  prerequisites.prerequisite_status())),
          ):
              try:
                  call()
              except errors.LaneRefusal:
                  refused.append(label)
              else:
                  raise SystemExit(f"GATE DID NOT REFUSE: {label}")
          print("refused:", refused)
          PROBE

      - name: Run the trusted-lane containment suite
        run: python -m pytest tests/test_trusted_lane_bootstrap.py -q -rs
