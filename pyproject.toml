[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bubblegauge"
version = "3.0.0"
description = "Self-hosted AI bubble regime monitor. Three-leg composite (valuation, credit, breadth, GSADF, LPPLS) with Monte Carlo bands, Faber trend trigger, and API. Research, not advice."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.3",
    "APScheduler>=3.10,<4",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    # <2.3 / <3.0: newer numpy wheels raise the x86-64 CPU baseline and die
    # with SIGILL (Illegal instruction) on older CPUs and on VMs with generic
    # CPU models (qemu64/kvm64). Relax only if all deploy targets expose
    # x86-64-v2+ (or the VM uses host CPU passthrough).
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=0.30",
    "lppls==0.6.24",
]

[project.optional-dependencies]
# pyarrow is optional: pandas imports it eagerly when installed, and its
# Arrow C++ wheels require SSE4.2 — SIGILL on older CPUs. Without it, the
# Parquet export disables itself (runtime subprocess probe); everything else
# works. Install .[parquet] on hosts with a modern CPU.
parquet = [
    "pyarrow>=16.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
