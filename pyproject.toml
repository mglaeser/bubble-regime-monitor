[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bubblegauge"
version = "3.0.0"
description = "Self-hosted AI bubble regime monitor. Three-leg composite (valuation, credit, breadth, GSADF, LPPLS) with Monte Carlo bands, Faber trend trigger, and API. Research, not advice."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.3",
    "APScheduler>=3.10,<4",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyarrow>=16.0",
    "anthropic>=0.30",
    "lppls==0.6.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
