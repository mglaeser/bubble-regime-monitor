[build-system]
# >=83.0.0 clears PYSEC-2026-3447 (pip-audit finding, audit A-08/B-04).
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "bubblegauge"
version = "3.0.0"
description = "Self-hosted AI bubble regime monitor. Three-leg composite (valuation, credit, breadth, GSADF, LPPLS) with Monte Carlo bands, Faber trend trigger, and API. Research, not advice."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0,<2.1",   # 2.1.0 (2026-09-24) raised the mypy ratchet; production runs 2.0
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.3",
    "APScheduler>=3.10,<4",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    # <2.3 / <3.0: numpy 2.3 and pandas 3.0 (copy-on-write, string dtype) are
    # upgrades of their own against the golden fixture, so a re-lock for an
    # unrelated change must not pull them in. The old-CPU reason is gone: the
    # host is an EPYC (owner decision D8, 2026-09-28).
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",  # legacy .xls support (shillerdata ie_data.xls CAPE fallback)
    "lxml>=5.2",
    # The NYSE calendar, one-off closures included. Exact: a release can add a
    # closure, which moves trading-day arithmetic, so the version moves on purpose.
    "holidays==0.105",
    # The alert ruleset is a YAML artifact; the loader parses it with safe_load.
    "PyYAML>=6.0",
    # A message carries no link: linkify-it-py finds links, libphonenumber the
    # numbers a phone dials (app/message_engine/checks.py). Exact pins - an
    # upgrade changes what counts, so it is made on purpose. The lite build of
    # phonenumbers has no geocoder or carrier data.
    "linkify-it-py==2.2.0",
    "phonenumberslite==9.0.40",
    "lppls==0.6.24",
    # The Parquet snapshot export (app/services/backfill.py, `bubblegauge
    # export snapshots --format parquet`).
    "pyarrow>=16.0",
]

[project.scripts]
bubblegauge = "app.cli:main"

[project.optional-dependencies]
# yfinance is the QUATERNARY price provider (documented-unreliable, ToS-gray),
# and the one free source of raw index levels. Not installed by default;
# install .[yfinance] to activate that tier. When absent the price chain
# simply skips it (ProviderNotConfigured, no health penalty).
yfinance = [
    "yfinance>=0.2.40",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
    # Blocking OpenAPI 3.1 structure and JSON Schema 2020-12 example gates.
    "openapi-spec-validator==0.9.0",
    "jsonschema==4.26.0",
    # CI's security gates.
    "pip-audit",
    "detect-secrets",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.routers" = ["*.html"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# 'S' (flake8-bandit) added by the audit (A-08/A-13/A-26): the prior config
# (E,F,I,W,UP,B) caught 1/4 seeded defects — it was blind to hard-coded secrets,
# swallowed exceptions and vacuous asserts. 'S110' now blocks new try/except/pass.
select = ["E", "F", "I", "W", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and carry throwaway secret-shaped literals by design.
"tests/**" = ["S"]
"scripts/**" = ["S101"]
# Intentional, isolated subprocess calls to the pinned R/lppls engines
# (SIGILL/hang containment is the whole point). Not untrusted input.
"app/engine/gsadf_runner.py" = ["S603", "S607"]
"app/indicators/d4_lppls.py" = ["S603", "S607"]
# Defensive type-narrowing assert for mypy; not a runtime control.
"app/db.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
