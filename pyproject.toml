[build-system]
# >=83.0.0 clears PYSEC-2026-3447 (pip-audit finding, audit A-08/B-04).
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "bubblegauge"
version = "3.0.0"
description = "Self-hosted AI bubble regime monitor. Three-leg composite (valuation, credit, breadth, GSADF, LPPLS) with Monte Carlo bands, Faber trend trigger, and API. Research, not advice."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.3",
    "APScheduler>=3.10,<4",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "numpy>=1.26",
    "pandas>=2.2",
    # Parquet export of snapshot rows.
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",  # legacy .xls support (shillerdata ie_data.xls CAPE fallback)
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=0.116",
    # The alert ruleset is a YAML artifact; the loader parses it with safe_load.
    "PyYAML>=6.0",
    "lppls==0.6.24",
]

[project.optional-dependencies]
# yfinance is the QUATERNARY price provider (documented-unreliable, ToS-gray),
# and the one free source of raw index levels. Not installed by default;
# install .[yfinance] to activate that tier. When absent the price chain
# simply skips it (ProviderNotConfigured, no health penalty).
yfinance = [
    "yfinance>=0.2.40",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.routers" = ["*.html"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# 'S' (flake8-bandit) added by the audit (A-08/A-13/A-26): the prior config
# (E,F,I,W,UP,B) caught 1/4 seeded defects — it was blind to hard-coded secrets,
# swallowed exceptions and vacuous asserts. 'S110' now blocks new try/except/pass.
select = ["E", "F", "I", "W", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and carry throwaway secret-shaped literals by design.
"tests/**" = ["S"]
"scripts/**" = ["S101"]
# Intentional, isolated subprocess calls to the pinned R/lppls engines
# (crash/hang containment is the whole point). Not untrusted input.
"app/engine/gsadf_runner.py" = ["S603", "S607"]
"app/indicators/d4_lppls.py" = ["S603", "S607"]
# The verifier runs `git` from a fixed argv under a curated hermetic
# environment (verifier.gitexec); the whole module's purpose is controlled
# subprocess execution, so the partial-path/untrusted-input heuristics do
# not apply. Argv is always constant; no shell; env is a whitelist.
"scripts/verifier/gitexec.py" = ["S603", "S607"]
"scripts/verifier/gitdiff.py" = ["S603", "S607"]
# Defensive type-narrowing assert for mypy; not a runtime control.
"app/db.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
