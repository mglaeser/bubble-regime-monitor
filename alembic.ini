[alembic]
script_location = migrations
prepend_sys_path = .
# Named, so that Alembic does not fall back to its deprecated legacy splitting
# of prepend_sys_path (a DeprecationWarning at every migration run under 1.20).
# The entry above is a single path, so the separator does not change how it is
# read. Pinned by tests/test_migrations.py::test_a_migration_run_raises_no_alembic_deprecation.
path_separator = os
sqlalchemy.url = sqlite:////data/bubble.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
