# bubblegauge alert ruleset v3.2 — THE COMPLETE INVENTORY.
#
# Every production rule lives here. No rule may exist only in Python: a rule
# the operator cannot see in this file is a mechanism nobody can audit, silence
# or replay. Rules that cannot run yet are present and DISABLED, each with a
# recorded reason, so "dark" is visible rather than absent.
#
# Reading this file:
#   enabled            the rule may run at all
#   enabled_in_stages  which rollout stages it may run in. `enabled` AND the
#                      active stage must both allow it — a stage is never
#                      skipped by flipping one flag.
#   policy_status      APPROVED | CALIBRATION_REQUIRED | GOVERNANCE_BLOCKED
#   runtime_readiness  READY | MISSING_INPUT | MISSING_HISTORY | UNPINNED | ...
#   authoritative      the rule keys off a persisted DECISION (band, red flag,
#                      override, leg state). Such a rule may not carry a
#                      numeric hysteresis and may not restate the decision's
#                      formula — the loader enforces both.
#   attribution        MECH (frozen mechanic) | LIT | JUDG | PIN
#
# A threshold with `value: null` and `attribution: PIN` is an UNRESOLVED pin.
# The loader refuses to enable any rule that references one, and the API
# reports null plus a reason — never the literal string "<PIN>".
#
# `capture.enabled` is written as a real boolean. An unquoted YAML `on` is the
# string "on" under YAML 1.2 and a boolean under YAML 1.1; a safety switch does
# not get to be ambiguous.

meta:
  rule_version: "v3.2.0"
  alert_input_schema_version: 1
  methodology_version: "v4.1-s4-asymmetric-contested"
  methodology_manifest_sha256: "4a7fd45cad1d61b6ee3983d35bbcb7da6f722fc2917653b075cbcf0079e3d275"  # pragma: allowlist secret  (public content hash of frozen_methodology.json)
  min_service_version: "3.8.0"
  max_service_version: "3.99.99"
  phrase_set: "v3.2"
  evaluator_version: "1"
  active_stage: 1
  note: >-
    Stage 1: schema, sidecar capture and pure evaluation only. Nothing in this
    file sends anything at active_stage 1 — delivery begins at stage 3 and only
    after an operator promotes this artifact by hand.

capture:
  enabled: true

rules:

  # =======================================================================
  # 11.1  REGIME — the action band itself
  # =======================================================================

  # Any entry into de-risk is P1, whatever it came from. This is a deliberate
  # ONE-TRANSITION LATENCY POLICY, not temporal smoothing: the Monte Carlo
  # spread is within-snapshot parameter uncertainty and says nothing about
  # persistence. Keep it only while replay shows <= 1 transient one-snapshot
  # P1 per 24 months (mandate 10.1 / 29).
  - rule_id: regime.band_to_derisk
    identity_version: 1
    title: "Effective action state enters de-risk"
    enabled: true
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [3, 4, 5, 6, 7]
    bucket: regime
    priority: 1
    source_fields: [effective_action_state]
    authoritative: true
    condition:
      kind: transition
      source: effective_action_state
      from_states: [hold, trim, suppressed]
      to_states: [de-risk]
    thresholds: []
    attribution: JUDG
    confirmation: {count: 1, basis: authoritative_transition}
    confirmation_sources: [effective_action_state]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: single_event
    candidate_ttl: null
    resolution: {policy: auto_on_inverse}
    cooldown_seconds: 172800
    reminder_policy: {enabled: true, after_seconds: 172800, max_reminders: 1}
    supersedes: [regime.band_hold_to_trim, regime.base_band_moved_while_suppressed]
    cancel_unsent_superseded: true
    group_key: regime
    quiet_hours_exempt: true
    budget_exempt: true
    phrase_set: "v3.2"
    required_caveat_codes: []

  - rule_id: regime.band_hold_to_trim
    identity_version: 1
    title: "Effective action state moves hold -> trim"
    enabled: true
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [3, 4, 5, 6, 7]
    bucket: regime
    priority: 2
    source_fields: [effective_action_state]
    authoritative: true
    condition:
      kind: transition
      source: effective_action_state
      from_states: [hold]
      to_states: [trim]
    thresholds: []
    attribution: MECH
    confirmation: {count: 1, basis: authoritative_transition}
    confirmation_sources: [effective_action_state]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: single_event
    candidate_ttl: null
    resolution: {policy: auto_on_inverse}
    cooldown_seconds: 86400
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: regime
    phrase_set: "v3.2"
    required_caveat_codes: []

  - rule_id: regime.band_trim_to_hold
    identity_version: 1
    title: "Effective action state moves trim -> hold"
    enabled: true
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [3, 4, 5, 6, 7]
    bucket: regime
    priority: 2
    source_fields: [effective_action_state]
    authoritative: true
    condition:
      kind: transition
      source: effective_action_state
      from_states: [trim]
      to_states: [hold]
    thresholds: []
    attribution: MECH
    confirmation: {count: 1, basis: authoritative_transition}
    confirmation_sources: [effective_action_state]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: single_event
    candidate_ttl: null
    resolution: {policy: auto_on_inverse}
    cooldown_seconds: 86400
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: regime
    phrase_set: "v3.2"
    required_caveat_codes: []

  # The decision moved while the DISPLAY stayed "suppressed". Without this the
  # operator sees an unchanged dashboard while the underlying call changed.
  - rule_id: regime.base_band_moved_while_suppressed
    identity_version: 1
    title: "Base band changed while coverage suppression is active"
    enabled: true
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [3, 4, 5, 6, 7]
    bucket: regime
    priority: 2
    source_fields: [base_action_band, band_suppressed_by_coverage]
    authoritative: true
    condition:
      kind: all_of
      terms:
        - {kind: transition, source: base_action_band,
           from_states: [hold, trim, de-risk], to_states: [hold, trim, de-risk]}
        - {kind: boolean_state, source: band_suppressed_by_coverage, equals: true}
    thresholds: []
    attribution: JUDG
    confirmation: {count: 1, basis: authoritative_transition}
    confirmation_sources: [base_action_band]
    hold_sources: [band_suppressed_by_coverage]
    freshness_requirements: {band_suppressed_by_coverage: same_snapshot}
    sync_policy: same_information_set
    candidate_ttl: null
    resolution: {policy: auto_on_condition_false}
    cooldown_seconds: 86400
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: regime
    phrase_set: "v3.2"
    required_caveat_codes: [DATA_DEGRADED]

  - rule_id: regime.score_jump_1r
    identity_version: 1
    title: "Point score jumps within one recompute"
    enabled: false
    disabled_reason: "delta_pp is an unresolved [PIN]: no operator artifact defines a material one-recompute point-score move."
    policy_status: CALIBRATION_REQUIRED
    runtime_readiness: UNPINNED
    enabled_in_stages: [3, 4, 5, 6, 7]
    bucket: regime
    priority: 2
    source_fields: [point_score]
    authoritative: false
    condition:
      kind: delta
      source: point_score
      mode: abs
      op: ge
      threshold: delta_pp
      window: previous_input
    thresholds:
      - {name: delta_pp, value: null, unit: points, attribution: PIN,
         note: "Material single-recompute move in the deterministic point score."}
    attribution: PIN
    confirmation: {count: 1, basis: adjacent_snapshots}
    confirmation_sources: [point_score]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: single_event
    candidate_ttl: null
    resolution: {policy: single_shot}
    cooldown_seconds: 86400
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: regime
    phrase_set: "v3.2"
    required_caveat_codes: []

  - rule_id: regime.score_trend_7d
    identity_version: 1
    title: "Point score trends over seven days"
    enabled: false
    disabled_reason: "delta_7d_pp is an unresolved [PIN]."
    policy_status: CALIBRATION_REQUIRED
    runtime_readiness: UNPINNED
