# ===========================================================================
# 12  CONSTELLATIONS
#
# Every constellation separates CONFIRMATION sources (which must ADVANCE on a
# new economic observation) from HOLD sources (which only have to stay true and
# stay fresh). Mixing them is how a monthly release ends up "confirming" a
# daily series three times in one afternoon.
# ===========================================================================

constellations:

  - rule_id: constellation.d_block_confirmed
    constellation_id: C-01
    identity_version: 1
    title: "Block D confirmed weak"
    enabled: false
    disabled_reason: "The seven-day point-score rise is an unresolved [PIN]."
    policy_status: CALIBRATION_REQUIRED
    runtime_readiness: UNPINNED
    enabled_in_stages: [5, 6, 7]
    bucket: constellation
    priority: 1
    source_fields: [breadth_pct, d2_multiplier, point_score]
    authoritative: false
    condition:
      kind: all_of
      terms:
        - {kind: delta, source: breadth_pct, mode: fall, op: ge,
           threshold: breadth_fall_pct, window: rolling_7d}
        - {kind: threshold, source: d2_multiplier, op: ge, threshold: rollover_level}
        - {kind: delta, source: point_score, mode: rise, op: ge,
           threshold: score_rise_7d, window: rolling_7d}
    thresholds:
      - {name: breadth_fall_pct, value: null, unit: percent, attribution: PIN}
      - {name: rollover_level, value: 1.0, unit: multiplier, attribution: MECH}
      - {name: score_rise_7d, value: null, unit: points, attribution: PIN}
    attribution: PIN
    confirmation: {count: 2, basis: distinct_economic_observation}
    confirmation_sources: [breadth_pct]
    hold_sources: [d2_multiplier, point_score]
    freshness_requirements: {d2_multiplier: within_release_period, point_score: same_snapshot}
    sync_policy: same_information_set
    candidate_ttl: {calendar: US_TRADING, intervals: 10, grace_seconds: 86400}
    resolution: {policy: auto_on_condition_false}
    cooldown_seconds: 604800
    reminder_policy: {enabled: true, after_seconds: 172800, max_reminders: 1}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: dynamics
    quiet_hours_exempt: true
    budget_exempt: true
    phrase_set: "v3.2"
    required_caveat_codes: []

