      source: point_score
      mode: abs
      op: ge
      threshold: delta_7d_pp
      window: rolling_7d
    thresholds:
      - {name: delta_7d_pp, value: null, unit: points, attribution: PIN,
         note: "Material seven-day move in the deterministic point score."}
    attribution: PIN
    confirmation: {count: 1, basis: adjacent_snapshots}
    confirmation_sources: [point_score]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: single_event
    candidate_ttl: null
    resolution: {policy: single_shot}
    cooldown_seconds: 172800
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: regime
    phrase_set: "v3.2"
    required_caveat_codes: []

  # A proximity warning on the MEDIAN, not a second band edge: 57 is a JUDG
  # early-warning level, and the de-risk decision remains the frozen one.
  - rule_id: regime.derisk_edge_approach
    identity_version: 1
    title: "Median approaching the de-risk edge and rising"
    enabled: false
    disabled_reason: "Stage 7 enrichment; not enabled before the P3 stage gate."
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [7]
    bucket: regime
    priority: 3
    source_fields: [headline_median]
    authoritative: false
    condition:
      kind: all_of
      terms:
        - {kind: range, source: headline_median, lower: approach_from, upper: derisk_edge}
        - {kind: delta, source: headline_median, mode: rise, op: ge,
           threshold: min_rise, window: adjacent_snapshots}
    thresholds:
      - {name: approach_from, value: 57.0, unit: points, attribution: JUDG,
         note: "Early-warning proximity level. NOT a band edge."}
      - {name: derisk_edge, value: 60.0, unit: points, attribution: MECH,
         note: "The frozen de-risk edge, read from the methodology artifact."}
      - {name: min_rise, value: 0.0, unit: points, attribution: JUDG,
         note: "Any non-negative move counts as rising."}
    attribution: JUDG
    confirmation: {count: 3, basis: adjacent_snapshots}
    confirmation_sources: [headline_median]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: independent
    candidate_ttl: {calendar: RECOMPUTE_SLOT, intervals: 6, grace_seconds: 5400}
    resolution: {policy: auto_on_condition_false}
    cooldown_seconds: 604800
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: regime
    phrase_set: "v3.2"
    required_caveat_codes: [NOT_A_PROBABILITY]

  - rule_id: regime.iqr_edge_cross
    identity_version: 1
    title: "Q1 of the Monte Carlo distribution crosses a band edge"
    enabled: false
    disabled_reason: "Stage 7 enrichment; not enabled before the P3 stage gate."
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [7]
    bucket: regime
    priority: 3
    source_fields: [iqr_lo]
    authoritative: false
    condition: {kind: crossing, source: iqr_lo, direction: up, level: derisk_edge}
    thresholds:
      - {name: derisk_edge, value: 60.0, unit: points, attribution: MECH,
         note: "Frozen de-risk edge; the crossing is reported, not re-decided."}
    attribution: MECH
    confirmation: {count: 2, basis: adjacent_snapshots}
    confirmation_sources: [iqr_lo]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: independent
    candidate_ttl: {calendar: RECOMPUTE_SLOT, intervals: 4, grace_seconds: 5400}
    resolution: {policy: auto_on_condition_false}
    cooldown_seconds: 604800
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: regime
    phrase_set: "v3.2"
    required_caveat_codes: [NOT_A_PROBABILITY]

  # =======================================================================
  # 11.2  OVERRIDE AND FLAGS
  # =======================================================================

  - rule_id: override.first_flag
    identity_version: 1
    title: "First fireable red flag becomes active"
    enabled: false
    disabled_reason: "Requires the typed red-flag contract on the trigger AND the predecessor snapshot; historical rows carry none."
    policy_status: APPROVED
    runtime_readiness: MISSING_HISTORY
    enabled_in_stages: [5, 6, 7]
    bucket: override
    priority: 3
    source_fields: [override_active_fireable_count]
    authoritative: false
    condition:
      kind: count
      source: override_active_fireable_count
      op: eq
      threshold: first_flag
    thresholds:
      - {name: first_flag, value: 1, unit: flags, attribution: MECH,
         note: "One active fireable flag. The override requirement itself is read from the snapshot."}
    attribution: MECH
    confirmation: {count: 1, basis: authoritative_transition}
    confirmation_sources: [override_active_fireable_count]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: single_event
    candidate_ttl: null
    resolution: {policy: auto_on_condition_false}
    cooldown_seconds: 604800
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: override
    phrase_set: "v3.2"
    required_caveat_codes: []

  # "One short of the override" WITHOUT hardcoding three: the requirement is
  # read from the snapshot, so a governance change to the override rule cannot
  # desynchronize this alert.
  - rule_id: override.warning
    identity_version: 1
    title: "One fireable flag short of the override"
    enabled: false
    disabled_reason: "Requires the typed red-flag contract on both the trigger and its predecessor."
    policy_status: APPROVED
    runtime_readiness: MISSING_HISTORY
    enabled_in_stages: [5, 6, 7]
    bucket: override
    priority: 2
    source_fields: [override_active_fireable_count, override_required_count]
    authoritative: false
    condition:
      kind: count
      source: override_active_fireable_count
      op: eq
      relative_to: override_required_count
      offset: -1
    thresholds: []
    attribution: MECH
    confirmation: {count: 1, basis: authoritative_transition}
    confirmation_sources: [override_active_fireable_count]
    hold_sources: [override_required_count]
    freshness_requirements: {override_required_count: same_snapshot}
    sync_policy: same_information_set
    candidate_ttl: null
    resolution: {policy: auto_on_condition_false}
    cooldown_seconds: 172800
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: override
    phrase_set: "v3.2"
    required_caveat_codes: []

  - rule_id: override.fires
    identity_version: 1
    title: "Non-compensatory override fires"
    enabled: true
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [3, 4, 5, 6, 7]
    bucket: override
    priority: 1
    source_fields: [override_fired]
    authoritative: true
    condition: {kind: boolean_transition, source: override_fired, to: true}
    thresholds: []
    attribution: MECH
    confirmation: {count: 1, basis: authoritative_transition}
    confirmation_sources: [override_fired]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: single_event
    candidate_ttl: null
    resolution: {policy: auto_on_inverse}
    cooldown_seconds: 172800
    reminder_policy: {enabled: true, after_seconds: 172800, max_reminders: 1}
    supersedes: [override.warning, override.first_flag]
    cancel_unsent_superseded: true
    group_key: override
    quiet_hours_exempt: true
    budget_exempt: true
    phrase_set: "v3.2"
    required_caveat_codes: []

  - rule_id: override.resolves
    identity_version: 1
    title: "Non-compensatory override clears"
    enabled: true
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [3, 4, 5, 6, 7]
    bucket: override
    priority: 2
    source_fields: [override_fired]
    authoritative: true
    condition: {kind: boolean_transition, source: override_fired, to: false}
    thresholds: []
    attribution: MECH
    confirmation: {count: 1, basis: authoritative_transition}
    confirmation_sources: [override_fired]
    hold_sources: []
    freshness_requirements: {}
    sync_policy: single_event
    candidate_ttl: null
    resolution: {policy: single_shot}
    cooldown_seconds: 172800
    reminder_policy: {enabled: false, after_seconds: null, max_reminders: 0}
    supersedes: []
    cancel_unsent_superseded: false
    group_key: override
    phrase_set: "v3.2"
    required_caveat_codes: []

  # =======================================================================
  # 11.3  EXECUTION LEGS
  # =======================================================================

  # The P1 gate is exactly: a NEW month-end SPY Faber IN -> OUT, AND the
  # headline MEDIAN at or above 55, AND data not degraded. A bare `score`
  # would be ambiguous between the median and the point score and is rejected
  # by the loader.
  - rule_id: legs.faber_spy_out_high_risk
    identity_version: 1
    title: "SPY Faber turns OUT in a high-risk regime"
    enabled: true
    policy_status: APPROVED
    runtime_readiness: READY
    enabled_in_stages: [3, 4, 5, 6, 7]
    bucket: legs
    priority: 1
    labels_schema: [asset]
    source_fields: [spy_faber_state, headline_median, data_degraded]
    authoritative: true
    condition:
      kind: all_of
      terms:
        - {kind: transition, source: spy_faber_state, from_states: [in], to_states: [out]}
        - {kind: threshold, source: headline_median, op: ge, threshold: gate_median}
        - {kind: boolean_state, source: data_degraded, equals: false}
    thresholds:
      - {name: gate_median, value: 55.0, unit: points, attribution: JUDG,
         note: "Execution gate on the Monte Carlo MEDIAN. Not the point score."}
    attribution: JUDG
    confirmation: {count: 1, basis: new_month_end_period}
    confirmation_sources: [spy_faber_state]
    hold_sources: [headline_median, data_degraded]
    freshness_requirements: {headline_median: same_snapshot, data_degraded: same_snapshot}
    sync_policy: same_information_set
    candidate_ttl: null
    resolution: {policy: auto_on_inverse}
    cooldown_seconds: 172800
    reminder_policy: {enabled: true, after_seconds: 172800, max_reminders: 1}
    supersedes: [legs.faber_spy_out_standard]
    cancel_unsent_superseded: true
    group_key: legs
    quiet_hours_exempt: true
    budget_exempt: true
    phrase_set: "v3.2"
    required_caveat_codes: []

  - rule_id: legs.faber_spy_out_standard
    identity_version: 1
    title: "SPY Faber turns OUT without the high-risk gate"
    enabled: true
    policy_status: APPROVED
    runtime_readiness: READY
